<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>الجليديه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#DCC9A0;
    --sand-light:#EFE4C9;
    --brown:#3E2B1E;
    --brown-soft:#7A6650;
    --olive:#6E7F45;
    --olive-dark:#54622F;
    --cream:#FBF6EC;
    --white:#FFFFFF;
    --red:#C1443B;
    --orange:#D9873D;
    --yellow:#C79A2A;
    --green:#5E8A52;
    --radius:16px;
    --shadow:0 3px 14px rgba(62,43,30,.14);
    --line:#E4D8BE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--brown);
    font-family:'Cairo',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button, input, select, textarea{font-family:inherit;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:78px;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;
    background:var(--brown);color:var(--cream);
    padding:14px 16px 12px;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:var(--shadow);
  }
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand .tag{
    background:var(--olive);color:var(--cream);
    font-weight:800;font-size:15px;padding:4px 10px;border-radius:8px;
    letter-spacing:.5px;
  }
  .brand .sub{font-size:11px;color:var(--sand);opacity:.85;}
  .topbar-actions{display:flex;gap:10px;align-items:center;}
  .icon-btn{
    background:rgba(255,255,255,.08);border:none;color:var(--cream);
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;cursor:pointer;position:relative;
  }
  .icon-btn .badge{
    position:absolute;top:-3px;left:-3px;background:var(--red);color:#fff;
    font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;padding:0 3px;
  }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    max-width:520px;margin:0 auto;
    background:var(--white);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 10px rgba(62,43,30,.08);
  }
  .navbtn{
    background:none;border:none;display:flex;flex-direction:column;align-items:center;
    gap:2px;color:var(--brown-soft);font-size:10.5px;font-weight:600;
    padding:6px 8px;border-radius:10px;flex:1;cursor:pointer;
  }
  .navbtn .ic{font-size:19px;}
  .navbtn.active{color:var(--olive-dark);background:var(--sand-light);}

  /* ---------- Generic layout ---------- */
  .view{padding:14px 14px 10px;}
  .section-title{font-size:17px;font-weight:800;margin:18px 0 10px;color:var(--brown);}
  .section-title:first-child{margin-top:2px;}
  .muted{color:var(--brown-soft);font-size:13px;}
  .row{display:flex;gap:10px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

  /* ---------- Stat cards ---------- */
  .stat-card{
    background:var(--white);border-radius:var(--radius);padding:12px 10px;
    box-shadow:var(--shadow);text-align:center;border-bottom:3px solid var(--olive);
  }
  .stat-card .num{font-size:22px;font-weight:800;color:var(--brown);display:block;line-height:1.2;}
  .stat-card .lbl{font-size:11.5px;color:var(--brown-soft);}
  .stat-card.warn{border-bottom-color:var(--orange);}
  .stat-card.danger{border-bottom-color:var(--red);}
  .stat-card.ok{border-bottom-color:var(--green);}

  /* ---------- Alerts ---------- */
  .alert{
    display:flex;gap:10px;align-items:flex-start;
    background:var(--white);border-radius:12px;padding:10px 12px;margin-bottom:8px;
    box-shadow:var(--shadow);border-right:5px solid var(--brown-soft);
    cursor:pointer;
  }
  .alert.red{border-right-color:var(--red);}
  .alert.orange{border-right-color:var(--orange);}
  .alert.yellow{border-right-color:var(--yellow);}
  .alert.green{border-right-color:var(--green);}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;}
  .dot.red{background:var(--red);}
  .dot.orange{background:var(--orange);}
  .dot.yellow{background:var(--yellow);}
  .dot.green{background:var(--green);}
  .alert-text{font-size:13.5px;line-height:1.5;}
  .empty{
    text-align:center;color:var(--brown-soft);font-size:13.5px;
    padding:26px 10px;background:var(--white);border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  /* ---------- Tag-style animal card ---------- */
  .tag-card{
    background:var(--white);border-radius:14px;box-shadow:var(--shadow);
    padding:12px;position:relative;margin-bottom:12px;border-right:6px solid var(--green);
    display:flex;gap:12px;cursor:pointer;
  }
  .tag-card::before{
    content:'';position:absolute;top:10px;right:-3px;width:9px;height:9px;
    background:var(--cream);border:2px solid var(--sand);border-radius:50%;
  }
  .tag-card.status-yellow{border-right-color:var(--yellow);}
  .tag-card.status-orange{border-right-color:var(--orange);}
  .tag-card.status-red{border-right-color:var(--red);}
  .tag-thumb{
    width:56px;height:56px;border-radius:10px;background:var(--sand-light);
    display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;
    overflow:hidden;
  }
  .tag-thumb img{width:100%;height:100%;object-fit:cover;}
  .tag-info{flex:1;min-width:0;}
  .tag-top{display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .tag-id{font-weight:800;font-size:14.5px;}
  .tag-name{color:var(--brown-soft);font-size:12.5px;}
  .tag-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;}
  .chip{
    background:var(--sand-light);color:var(--brown);font-size:11px;font-weight:600;
    padding:3px 8px;border-radius:20px;
  }
  .chip.soft{background:transparent;border:1px solid var(--line);}

  /* ---------- Buttons ---------- */
  .btn{
    background:var(--olive);color:#fff;border:none;border-radius:12px;
    padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;justify-content:center;
  }
  .btn:active{background:var(--olive-dark);}
  .btn.block{width:100%;}
  .btn.ghost{background:transparent;color:var(--olive-dark);border:1.5px solid var(--olive);}
  .btn.small{padding:8px 12px;font-size:12.5px;border-radius:10px;}
  .btn.danger{background:var(--red);}
  .fab{
    position:fixed;bottom:88px;left:50%;transform:translateX(-50%);
    max-width:520px;
  }
  .fab-inner{position:relative;left:190px;}

  /* ---------- Form elements ---------- */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--brown-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
    background:var(--white);font-size:14px;color:var(--brown);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--olive);border-color:var(--olive);}
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(62,43,30,.45);z-index:100;
    display:flex;align-items:flex-end;
  }
  .modal-sheet{
    background:var(--cream);width:100%;max-width:520px;margin:0 auto;
    border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));
    animation:slideUp .22s ease-out;
  }
  @keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-handle{width:38px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 12px;}
  .modal-title{font-size:16.5px;font-weight:800;margin-bottom:14px;}
  .modal-close{
    position:absolute;top:14px;left:14px;background:var(--sand-light);border:none;
    width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;color:var(--brown);
  }

  /* ---------- Tabs ---------- */
  .tabbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;}
  .tabbar::-webkit-scrollbar{display:none;}
  .tabitem{
    flex:none;background:var(--white);border:1.5px solid var(--line);color:var(--brown-soft);
    padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .tabitem.active{background:var(--olive);border-color:var(--olive);color:#fff;}

  /* ---------- Profile header ---------- */
  .profile-head{
    background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:14px;
  }
  .profile-thumb{
    width:76px;height:76px;border-radius:14px;background:var(--sand-light);
    display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;flex:none;
  }
  .profile-thumb img{width:100%;height:100%;object-fit:cover;}
  .profile-name{font-size:17px;font-weight:800;}
  .profile-sub{font-size:12.5px;color:var(--brown-soft);margin-top:2px;}

  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--brown-soft);}
  .kv .v{font-weight:700;}

  .list-item{
    background:var(--white);border-radius:12px;padding:11px 13px;margin-bottom:9px;
    box-shadow:var(--shadow);font-size:13px;
  }
  .list-item .top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:3px;}
  .list-item .top .date{color:var(--brown-soft);font-weight:600;font-size:12px;}

  .progress-wrap{background:var(--sand-light);border-radius:20px;height:10px;overflow:hidden;margin:8px 0;}
  .progress-bar{height:100%;background:var(--olive);border-radius:20px;}

  .timeline{position:relative;padding-right:18px;}
  .timeline::before{content:'';position:absolute;right:5px;top:4px;bottom:4px;width:2px;background:var(--line);}
  .tl-item{position:relative;margin-bottom:16px;}
  .tl-item::before{content:'';position:absolute;right:-18px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--olive);}
  .tl-date{font-size:11.5px;color:var(--brown-soft);font-weight:700;}
  .tl-text{font-size:13.5px;margin-top:2px;}

  .search-overlay{
    position:fixed;inset:0;background:var(--cream);z-index:90;max-width:520px;margin:0 auto;
    display:flex;flex-direction:column;
  }
  .search-input-wrap{padding:14px;display:flex;gap:8px;background:var(--brown);}
  .search-input-wrap input{flex:1;border-radius:10px;border:none;padding:11px 12px;font-size:14px;}

  .login-wrap{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:30px;background:linear-gradient(180deg, var(--brown) 0%, var(--brown) 40%, var(--cream) 40%);
  }
  .login-card{
    background:var(--white);border-radius:20px;box-shadow:var(--shadow);padding:28px 22px;width:100%;max-width:360px;
  }
  .login-logo{text-align:center;margin-bottom:22px;}
  .login-logo .tag{
    display:inline-block;background:var(--olive);color:#fff;font-weight:800;font-size:22px;
    padding:8px 18px;border-radius:12px;letter-spacing:.5px;
  }
  .login-logo .sub{color:var(--sand-light);font-size:12.5px;margin-top:8px;}
  .hint{font-size:11.5px;color:var(--brown-soft);text-align:center;margin-top:10px;line-height:1.6;}

  .weight-chart{width:100%;height:110px;}
  .toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--brown);color:#fff;
    padding:10px 18px;border-radius:24px;font-size:13px;font-weight:600;z-index:200;box-shadow:var(--shadow);
    max-width:90%;text-align:center;
  }
  .drawer-list .list-item{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .drawer-list .list-item .ic{font-size:18px;}

  /* ============================= V2 ENHANCEMENTS ============================= */
  .attention-wrap{background:linear-gradient(180deg,rgba(193,68,59,.08),transparent);border:1px solid rgba(193,68,59,.14);border-radius:18px;padding:12px;margin-bottom:10px}
  .attention-title{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;font-weight:800;margin-bottom:8px}
  .attention-title .count{background:var(--red);color:white;border-radius:20px;padding:2px 8px;font-size:11px}
  .quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .quick-action{border:1px solid var(--line);background:var(--white);border-radius:12px;padding:9px 6px;font-size:11.5px;font-weight:700;color:var(--brown);cursor:pointer;box-shadow:0 1px 6px rgba(62,43,30,.06)}
  .quick-action .qa-ic{display:block;font-size:20px;margin-bottom:3px}
  .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .photo-card{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--sand-light);border:1px solid var(--line)}
  .photo-card img{width:100%;height:100%;object-fit:cover;display:block}
  .photo-card .photo-actions{position:absolute;inset:auto 4px 4px 4px;display:flex;gap:4px}
  .photo-mini-btn{border:none;border-radius:8px;background:rgba(62,43,30,.82);color:#fff;font-size:10px;padding:5px 7px;cursor:pointer;flex:1}
  .photo-main{position:absolute;top:5px;right:5px;background:var(--olive);color:#fff;border-radius:8px;padding:3px 6px;font-size:9.5px;font-weight:800}
  .upload-box{border:1.5px dashed var(--olive);background:rgba(110,127,69,.06);padding:14px;border-radius:14px;text-align:center;margin-bottom:12px}
  .upload-box input[type=file]{width:100%;margin-top:8px}
  .notice{padding:10px 12px;border-radius:12px;background:var(--sand-light);font-size:12.5px;line-height:1.6;margin-bottom:10px}
  .notice.danger{background:rgba(193,68,59,.09);color:#8B2F29}
  .notice.ok{background:rgba(94,138,82,.10);color:#416339}
  .stack{display:flex;flex-direction:column;gap:8px}
  .subcard{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px}
  .subcard-title{font-weight:800;font-size:13.5px;margin-bottom:8px}
  .money{font-weight:800;font-variant-numeric:tabular-nums}
  .table-scroll{overflow:auto;background:var(--white);border-radius:14px;border:1px solid var(--line)}
  .mini-table{width:100%;border-collapse:collapse;min-width:540px;font-size:12px}
  .mini-table th,.mini-table td{padding:9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  .mini-table th{background:var(--sand-light);font-weight:800}
  .pill-row{display:flex;gap:6px;flex-wrap:wrap}
  .metric-card{background:var(--white);border-radius:14px;padding:12px;border:1px solid var(--line);box-shadow:0 1px 7px rgba(62,43,30,.06)}
  .metric-card .big{font-size:22px;font-weight:800}
  .metric-card .small{font-size:11.5px;color:var(--brown-soft)}
  .report-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .nav-section{font-size:11px;color:var(--brown-soft);font-weight:800;margin:14px 4px 7px}
  .section-link{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--white);padding:12px;border-radius:12px;margin-bottom:8px;border:1px solid var(--line);cursor:pointer}
  .section-link .left{display:flex;align-items:center;gap:10px}
  .section-link .ic{font-size:20px}
  .file-preview{margin-top:8px;font-size:11.5px;color:var(--brown-soft)}
  .newborn-box{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .newborn-title{font-weight:800;margin-bottom:8px}
  .status-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .action-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .action-line .btn{flex:1;min-width:120px}
  .modal-sheet.wide{max-width:720px}
  .sync-status{font-size:10px;color:var(--sand);opacity:.9}
  .sync-status.ok{color:#D9F0D3}
  .sync-status.err{color:#FFD1CE}
  .sticky-save{position:sticky;bottom:0;padding-top:10px;background:linear-gradient(transparent,var(--cream) 25%)}
  @media (min-width:700px){
    #app{max-width:900px}
    .bottomnav{max-width:900px}
    .modal-sheet{max-width:760px}
    .search-overlay{max-width:900px}
    .grid3{grid-template-columns:repeat(6,1fr)}
    .quick-actions{grid-template-columns:repeat(6,1fr)}
    .report-grid{grid-template-columns:repeat(4,1fr)}
  }

</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ablltpquylsxxsyywiwg.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_QbJcjR9USu2jbwx7T_o6FA_e0RhnXWz';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);


/* ============================= STATE ============================= */
let state = null;
let session = { loggedIn:false, user:null, view:'dashboard', params:{} };
let saveTimer = null;

function defaultState(){
  return {
    settings:{
      farmName:'الجليديه',
      idPrefixes:{ cow:'C', camel:'CAM', sheep:'S' },
      typeLabels:{ cow:{m:'الثور',f:'البقرة',plural:'الأبقار'}, camel:{m:'الجمل',f:'الناقة',plural:'الإبل'}, sheep:{m:'الكبش',f:'النعجة',plural:'الغنم'} },
      gestation:{ cow:283, camel:390, sheep:150 },
    },
    animals:[],
    tasks:[]
  };
}

async function loadState(){
  if(!session.user){ state = defaultState(); return; }
  try{
    const { data, error } = await supabaseClient
      .from('farm_state')
      .select('state_json')
      .eq('user_id', session.user.id)
      .maybeSingle();
    if(error) throw error;
    if(data && data.state_json){
      state = data.state_json;
    } else {
      state = defaultState();
      const { error: insertError } = await supabaseClient.from('farm_state').upsert({
        user_id: session.user.id, state_json: state, updated_at: new Date().toISOString()
      }, { onConflict:'user_id' });
      if(insertError) throw insertError;
    }
  }catch(e){
    console.error(e);
    state = defaultState();
    showToast('تعذر تحميل بيانات المزرعة من قاعدة البيانات');
  }
  if(!state.settings) state.settings = defaultState().settings;
  if(!state.animals) state.animals = [];
  if(!state.tasks) state.tasks = [];
}

function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(!session.user) return;
    try{
      const { error } = await supabaseClient.from('farm_state').upsert({
        user_id: session.user.id, state_json: state, updated_at: new Date().toISOString()
      }, { onConflict:'user_id' });
      if(error) throw error;
    }catch(e){
      console.error(e);
      showToast('تعذر الحفظ السحابي، تحقق من الاتصال');
    }
  }, 350);
}

/* ============================= HELPERS ============================= */
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowTimeStr(){ const d=new Date(); return d.toTimeString().slice(0,5); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('ar-OM',{day:'numeric',month:'long',year:'numeric'}); }
function fmtDateTime(v){ if(!v) return '—'; const dt=new Date(v); return dt.toLocaleString('ar-OM',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); }
function isDueDateTime(v){ return !!v && new Date(v).getTime() <= Date.now(); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function arNum(n, s, du, pl, ma){
  if(n<=0) return null;
  if(n===1) return s;
  if(n===2) return du;
  if(n>=3 && n<=10) return n+' '+pl;
  return n+' '+ma;
}
function calcAge(birth){
  if(!birth) return '—';
  const b=new Date(birth+'T00:00:00'), n=new Date();
  let y=n.getFullYear()-b.getFullYear(), m=n.getMonth()-b.getMonth(), d=n.getDate()-b.getDate();
  if(d<0){ m--; d += new Date(n.getFullYear(), n.getMonth(), 0).getDate(); }
  if(m<0){ y--; m+=12; }
  const parts=[
    arNum(y,'سنة','سنتان','سنوات','سنة'),
    arNum(m,'شهر','شهران','أشهر','شهرًا'),
    arNum(d,'يوم','يومان','أيام','يومًا')
  ].filter(Boolean);
  return parts.length ? parts.join(' و') : 'أقل من يوم';
}

function typeLabel(type, plural){
  const t = state.settings.typeLabels[type];
  if(!t) return type;
  return plural ? t.plural : t.f;
}
function animalLabel(a){
  const t = state.settings.typeLabels[a.type] || {m:a.type,f:a.type};
  const base = a.gender==='ذكر' ? t.m : t.f;
  return `${base} ${a.customId}${a.name ? ' ('+a.name+')' : ''}`;
}
function animalById(id){ return state.animals.find(x=>x.id===id); }

function nextCustomId(type){
  const prefix = state.settings.idPrefixes[type] || type.toUpperCase();
  const nums = state.animals.filter(a=>a.type===type).map(a=>{
    const m = (a.customId||'').match(/(\d+)\s*$/);
    return m ? parseInt(m[1],10) : 0;
  });
  const max = nums.length ? Math.max(...nums) : 0;
  return prefix + '-' + String(max+1).padStart(3,'0');
}

function addTimeline(animal, text, type){
  animal.timeline = animal.timeline || [];
  animal.timeline.unshift({ date: todayISO(), text, type: type||'عام' });
}

function healthColor(status){
  return { 'سليم':'green', 'تحت المراقبة':'yellow', 'يحتاج علاج':'orange', 'حالة عاجلة':'red' }[status] || 'green';
}

function computeNotifications(){
  const notes = [];
  const today = todayISO();
  state.animals.forEach(a=>{
    if(a.status !== 'موجود في المزرعة') return;
    if(a.pregnancy && a.pregnancy.active){
      const rem = daysBetween(today, a.pregnancy.dueDate);
      if(rem <= 30){
        const level = rem<=3 ? 'red' : rem<=7 ? 'orange' : 'yellow';
        const txt = rem<0 ? `${animalLabel(a)} تجاوزت موعد الولادة المتوقع` : `${animalLabel(a)} متوقع ولادتها خلال ${rem<=0?'اليوم':rem+' '+(rem===1?'يوم':'أيام')}`;
        notes.push({ level, text: txt, animalId:a.id, kind:'ولادة' });
      }
    }
    (a.followUps||[]).forEach(f=>{
      if(f.active && isDueDateTime(f.nextDue)){
        notes.push({ level:'red', text:`${animalLabel(a)} تحتاج متابعة الآن — ${f.reason} · الاستحقاق ${fmtDateTime(f.nextDue)}`, animalId:a.id, kind:'متابعة' });
      }
    });
    const lastBreeding = (a.breedings||[]).slice(-1)[0];
    if(!(a.pregnancy && a.pregnancy.active) && lastBreeding && lastBreeding.pregCheckDate){
      const checkRem = daysBetween(today, lastBreeding.pregCheckDate);
      if(checkRem <= 3){
        const level = checkRem < 0 ? 'red' : checkRem === 0 ? 'orange' : 'yellow';
        const text = checkRem < 0
          ? `${animalLabel(a)} فحص الحمل متأخر ${Math.abs(checkRem)} يوم`
          : checkRem === 0
            ? `${animalLabel(a)} موعد فحص الحمل اليوم`
            : `${animalLabel(a)} موعد فحص الحمل خلال ${checkRem} أيام`;
        notes.push({ level, text, animalId:a.id, kind:'فحص حمل' });
      }
    }
    (a.vaccinations||[]).forEach(v=>{
      if(v.nextDate){
        const rem = daysBetween(today, v.nextDate);
        if(rem>=0 && rem<=3){
          notes.push({ level: rem===0?'red':'yellow', text:`${animalLabel(a)} لديها تطعيم (${v.name}) ${rem===0?'اليوم':'خلال '+rem+' أيام'}`, animalId:a.id, kind:'تطعيم' });
        }
      }
    });
    (a.medications||[]).forEach(m=>{
      if(m.startDate<=today && m.endDate>=today){
        notes.push({ level:'yellow', text:`${animalLabel(a)} ضمن برنامج دواء: ${m.name}`, animalId:a.id, kind:'دواء' });
      }
    });
    if(a.healthStatus === 'حالة عاجلة'){
      notes.push({ level:'red', text:`${animalLabel(a)} في حالة صحية عاجلة`, animalId:a.id, kind:'صحة' });
    } else if(a.healthStatus === 'يحتاج علاج'){
      notes.push({ level:'orange', text:`${animalLabel(a)} يحتاج علاج`, animalId:a.id, kind:'صحة' });
    }
  });
  state.tasks.forEach(t=>{
    if(!t.done && t.dueDate){
      if(t.dueDate < today) notes.push({ level:'red', text:`مهمة متأخرة: ${t.title}`, taskId:t.id, kind:'مهمة' });
      else if(t.dueDate === today) notes.push({ level:'orange', text:`مهمة اليوم: ${t.title}`, taskId:t.id, kind:'مهمة' });
    }
  });
  const rank = {red:0, orange:1, yellow:2, green:3};
  notes.sort((a,b)=>rank[a.level]-rank[b.level]);
  return notes;
}

function showToast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

        <div class="kv"><span class="k">الأيام المتبقية</span><span class="v">${remaining<0?'تجاوزت الموعد':remaining+' يوم'}</span></div>
      </div>

      <div class="muted" style="text-align:center">${pct}% من مدة الحمل</div>
      <div class="grid2" style="margin-top:12px">

  return `

    <button class="btn block" style="margin-top:10px" onclick="openConfirmPregnancy('${a.id}')">+ تأكيد حمل</button>

function savePregnancy(id){
  const a = animalById(id);
  const breedingDate = document.getElementById('pBreedDate').value;
  const gest = state.settings.gestation[a.type] || 283;
  const due = new Date(breedingDate+'T00:00:00');
  due.setDate(due.getDate()+gest);
  a.pregnancy = {
    active:true,
    breedingDate,
    confirmedDate: document.getElementById('pConfirmDate').value,
    confirmedBy: document.getElementById('pBy').value.trim(),
    dueDate: due.toISOString().slice(0,10),
    notes: document.getElementById('pNotes').value.trim()
  };
  addTimeline(a, 'تأكيد الحمل — موعد الولادة المتوقع: '+fmtDate(a.pregnancy.dueDate), 'حمل');
  saveState(); closeModal(); showToast('تم تسجيل الحمل'); profileTab='pregnancy'; renderView();

  const a = animalById(id);
  if(!confirm('هل تريد إلغاء تسجيل الحمل الحالي؟')) return;
  a.pregnancy = null;
  addTimeline(a, 'تم إلغاء تسجيل الحمل', 'حمل');

function createOffspring(motherId, birthId){
  const mother = animalById(motherId);
  const birth = mother.births.find(x=>x.id===birthId);
  const gender = birth.offspringGender==='مختلط' ? 'أنثى' : birth.offspringGender;
  openAddAnimal({
    type: mother.type, gender, birthDate: birth.date, weight: birth.weight,
    motherId: mother.id, fatherId: (mother.breedings.slice(-1)[0]||{}).maleId || null,
    location: mother.location, _offspringOf: birthId
  });
  // patch saveAnimal to link back after creation
  window.__linkBirth = { motherId, birthId };
}
const _origSaveAnimal = saveAnimal;
saveAnimal = function(offspringOfBirthCtx){
  _origSaveAnimal(offspringOfBirthCtx);
  if(window.__linkBirth){
    const mother = animalById(window.__linkBirth.motherId);
    const birth = mother.births.find(x=>x.id===window.__linkBirth.birthId);
    const newAnimal = state.animals[state.animals.length-1];
    birth.offspringIds.push(newAnimal.id);
    addTimeline(mother, `تم إنشاء ملف للمولود: ${newAnimal.customId}`, 'ولادة');
    window.__linkBirth = null;
    saveState();
  }
};

/* ---- Weight ---- */
function tabWeight(a){
  const ws = a.weights||[];
  let chart = '';
  if(ws.length>=2){
    const vals = ws.map(w=>w.weight);
    const min = Math.min(...vals), max = Math.max(...vals);
    const w=300,h=90,pad=8;
    const pts = ws.map((w2,i)=>{
      const x = pad + (i/(ws.length-1))*(w-2*pad);
      const y = h-pad - ((w2.weight-min)/((max-min)||1))*(h-2*pad);
      return `${x},${y}`;
    }).join(' ');
    chart = `<svg class="weight-chart" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="#6E7F45" stroke-width="2.5"/></svg>`;
  }
  return `
    <button class="btn block" onclick="openAddWeight('${a.id}')">+ تسجيل وزن</button>
    ${chart?`<div class="list-item">${chart}</div>`:''}
    <div class="section-title" style="font-size:14.5px">سجل الوزن</div>
    ${ws.length ? ws.slice().reverse().map(w=>`
      <div class="list-item"><div class="top"><span>${w.weight} كجم</span><span class="date">${fmtDate(w.date)}</span></div>${w.notes?`<div class="muted">${esc(w.notes)}</div>`:''}</div>
    `).join('') : `<div class="empty">لا توجد قراءات وزن</div>`}
  `;
}

function doSearch(q){
  q = q.trim().toLowerCase();
  const res = document.getElementById('searchResults');
  if(!q){ res.innerHTML=''; return; }
  const matches = state.animals.filter(a=>{
    const father = a.fatherId ? animalById(a.fatherId) : null;
    const mother = a.motherId ? animalById(a.motherId) : null;
    const hay = [a.customId,a.name,a.type,a.breed,father?father.customId:'',mother?mother.customId:''].join(' ').toLowerCase();
    return hay.includes(q);
  });
  res.innerHTML = matches.length ? matches.map(a=>`<div onclick="document.getElementById('searchOverlay').remove(); navigate('animalProfile',{id:'${a.id}'})">${animalCard(a)}</div>`).join('') : `<div class="empty">لا توجد نتائج</div>`;
}

/* ============================= الجليديه V2 ============================= */
const MEDIA_BUCKET = 'farm-media';
let syncState = {saving:false,lastOk:null,lastError:null};

function localISODate(d){
  d = d || new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
todayISO = function(){ return localISODate(new Date()); };
nowTimeStr = function(){ const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
function monthKey(v){ if(!v) return ''; return String(v).slice(0,7); }
function dateTimeLocalValue(d){
  d = d || new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  const h=String(d.getHours()).padStart(2,'0'), mi=String(d.getMinutes()).padStart(2,'0');
  return `${y}-${m}-${day}T${h}:${mi}`;
}
function toISOFromLocal(v){ return v ? new Date(v).toISOString() : null; }
function fmtTime(v){
  if(!v) return '—';
  const d=new Date(v);
  return d.toLocaleTimeString('ar-OM',{hour:'numeric',minute:'2-digit'});
}
function fmtMoney(v){ return (Number(v)||0).toLocaleString('ar-OM',{minimumFractionDigits:3,maximumFractionDigits:3})+' ر.ع'; }
function safeNumber(v){ const n=Number(v); return Number.isFinite(n)?n:0; }
function daysUntilDate(v){ return v ? Math.ceil((new Date(v+'T23:59:59').getTime()-Date.now())/86400000) : null; }
function fileNameSafe(name){ return String(name||'image').replace(/[^\w.\-]+/g,'_'); }
function animalTypeName(type){ return ({cow:'أبقار',camel:'إبل',sheep:'غنم'})[type]||type; }

defaultState = function(){
  return {
    settings:{
      farmName:'الجليديه',
      idPrefixes:{ cow:'C', camel:'CAM', sheep:'S' },
      typeLabels:{ cow:{m:'الثور',f:'البقرة',plural:'الأبقار'}, camel:{m:'الجمل',f:'الناقة',plural:'الإبل'}, sheep:{m:'الكبش',f:'النعجة',plural:'الغنم'} },
      gestation:{ cow:283, camel:390, sheep:150 },
      currency:'OMR'
    },
    animals:[],

  };
};

function normalizeAnimal(a){
  a.breedings = a.breedings||[];
  a.births = a.births||[];
  a.healthCases = a.healthCases||[];
  a.medications = a.medications||[];
  a.vaccinations = a.vaccinations||[];
  a.weights = a.weights||[];
  a.followUps = a.followUps||[];
  a.timeline = a.timeline||[];
  a.photos = a.photos||[];
  a.status = a.status||'موجود في المزرعة';
  a.healthStatus = a.healthStatus||'سليم';
  if(a.photoUrl && !a.photos.some(p=>p.url===a.photoUrl)){
    a.photos.unshift({id:uid('ph'),url:a.photoUrl,path:null,date:a.entryDate||todayISO(),note:'صورة سابقة',main:true});
  }
  if(a.photos.length && !a.photos.some(p=>p.main)) a.photos[0].main=true;
  if(a.photos.length){
    const main=a.photos.find(p=>p.main)||a.photos[0];
    a.photoUrl=main.url||a.photoUrl||'';
  }
  a.breedings.forEach(b=>{

  a.medications.forEach(m=>{
    if(m.active===undefined) m.active = !!(m.endDate && m.endDate>=todayISO());
    m.logs=m.logs||[];
  });
  return a;
}

async function compressImage(file,maxSide=1600,quality=.82){
  if(!file || !file.type.startsWith('image/')) return file;
  return await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        let w=img.width,h=img.height;
        const scale=Math.min(1,maxSide/Math.max(w,h));
        w=Math.round(w*scale); h=Math.round(h*scale);
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>resolve(blob||file),'image/jpeg',quality);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function uploadMedia(file,folder){
  if(!file) return null;
  if(!session.user) throw new Error('يجب تسجيل الدخول');
  const blob=await compressImage(file);
  const path=`${session.user.id}/${folder}/${Date.now()}_${fileNameSafe(file.name).replace(/\.[^.]+$/,'.jpg')}`;
  const {error}=await supabaseClient.storage.from(MEDIA_BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:false});
  if(error) throw error;
  const {data:signedData,error:signError}=await supabaseClient.storage.from(MEDIA_BUCKET).createSignedUrl(path,900);
  if(signError) throw signError;
  return {url:signedData?.signedUrl||'',path};
}
async function deleteMedia(path){
  if(!path) return;
  const {error}=await supabaseClient.storage.from(MEDIA_BUCKET).remove([path]);
  if(error) console.warn(error);
}

computeNotifications = function(){
  const notes=[], today=todayISO(), now=Date.now();
  const add=(level,text,extra={})=>notes.push({level,text,...extra});
  state.animals.forEach(a=>{
    if(a.status!=='موجود في المزرعة') return;
    if(a.pregnancy?.active && a.pregnancy.dueDate){
      const rem=daysBetween(today,a.pregnancy.dueDate);
      if(rem<=30){
        const level=rem<=3?'red':rem<=7?'orange':'yellow';
        add(level,rem<0?`${animalLabel(a)} تجاوزت موعد الولادة المتوقع بـ ${-rem} يوم`:
          `${animalLabel(a)} متوقع ولادتها ${rem<=0?'اليوم':'خلال '+rem+' '+(rem===1?'يوم':'أيام')}`,
          {animalId:a.id,kind:'ولادة'});
      }
    }
    (a.breedings||[]).forEach(b=>{
      if(b.pregCheckDate && (b.pregnancyStatus||'pending')==='pending'){
        const rem=daysBetween(today,b.pregCheckDate);
        if(rem<=3){
          const text=rem<0?`${animalLabel(a)} فحص الحمل متأخر ${-rem} يوم`:
            rem===0?`${animalLabel(a)} موعد فحص الحمل اليوم`:
            `${animalLabel(a)} فحص الحمل خلال ${rem} أيام`;
          add(rem<0?'red':rem===0?'orange':'yellow',text,{animalId:a.id,kind:'فحص حمل'});
        }
      }
    });
    (a.followUps||[]).forEach(f=>{
      if(f.active && f.nextDue && new Date(f.nextDue).getTime()<=now){
        add('red',`${animalLabel(a)} — متابعة الآن: ${f.reason} · ${fmtTime(f.nextDue)}`,{animalId:a.id,kind:'متابعة'});
      }
    });
    (a.medications||[]).forEach(m=>{
      if(m.active && m.nextDoseAt && new Date(m.nextDoseAt).getTime()<=now){
        add('red',`${animalLabel(a)} — جرعة مستحقة: ${m.name} (${m.dose||''} ${m.doseUnit||''})`,{animalId:a.id,kind:'دواء'});
      }
    });
    (a.vaccinations||[]).forEach(v=>{
      if(v.nextDate){
        const rem=daysBetween(today,v.nextDate);
        if(rem>=0 && rem<=3) add(rem===0?'orange':'yellow',`${animalLabel(a)} لديها تطعيم ${v.name} ${rem===0?'اليوم':'خلال '+rem+' أيام'}`,{animalId:a.id,kind:'تطعيم'});
      }
    });
    if(a.healthStatus==='حالة عاجلة') add('red',`${animalLabel(a)} في حالة صحية عاجلة`,{animalId:a.id,kind:'صحة'});
    else if(a.healthStatus==='يحتاج علاج') add('orange',`${animalLabel(a)} يحتاج علاج`,{animalId:a.id,kind:'صحة'});
  });
  state.tasks.forEach(t=>{
    if(!t.done && t.dueDate){
      if(t.dueDate<today) add('red',`مهمة متأخرة: ${t.title}`,{taskId:t.id,kind:'مهمة'});
      else if(t.dueDate===today) add('orange',`مهمة اليوم: ${t.title}`,{taskId:t.id,kind:'مهمة'});
    }
  });
  state.medicineInventory.forEach(i=>{
    const qty=safeNumber(i.quantity), min=safeNumber(i.minStock);
    if(qty<=min) add(qty<=0?'red':'orange',`مخزون الدواء منخفض: ${i.name} — المتبقي ${qty} ${i.unit||''}`,{kind:'مخزون دواء'});
    if(i.expiryDate){
      const rem=daysBetween(today,i.expiryDate);
      if(rem<0) add('red',`انتهت صلاحية الدواء: ${i.name}`,{kind:'انتهاء دواء'});
      else if(rem<=30) add('yellow',`دواء ${i.name} تنتهي صلاحيته خلال ${rem} يوم`,{kind:'انتهاء دواء'});
    }
  });
  state.feedInventory.forEach(i=>{
    if(safeNumber(i.quantity)<=safeNumber(i.minStock)) add(safeNumber(i.quantity)<=0?'red':'orange',`مخزون العلف منخفض: ${i.name} — المتبقي ${i.quantity} ${i.unit||''}`,{kind:'مخزون علف'});
  });
  const rank={red:0,orange:1,yellow:2,green:3};
  return notes.sort((a,b)=>rank[a.level]-rank[b.level]);
};

};

/* ============================= التقارير والتصدير ============================= */
let reportMonth=monthKey(todayISO());
function reportData(month){
  const animals=state.animals,active=animals.filter(a=>a.status==='موجود في المزرعة');
  const births=[];animals.forEach(a=>(a.births||[]).forEach(b=>{if(monthKey(b.date)===month)births.push({mother:a.customId,date:b.date,count:(b.newborns||[]).length||b.count||1,type:b.type});}));
  const health=[];animals.forEach(a=>(a.healthCases||[]).forEach(h=>{const d=h.at?h.at.slice(0,10):h.date;if(monthKey(d)===month)health.push({animal:a.customId,date:d,diagnosis:h.diagnosis,severity:h.severity,status:h.caseStatus});}));
  const meds=[];animals.forEach(a=>(a.medications||[]).forEach(m=>{const d=(m.startAt||m.startDate||'').slice(0,10);if(monthKey(d)===month)meds.push({animal:a.customId,date:d,name:m.name,dose:(m.dose||'')+' '+(m.doseUnit||'')});}));
  const vacc=[];animals.forEach(a=>(a.vaccinations||[]).forEach(v=>{if(monthKey(v.date)===month)vacc.push({animal:a.customId,date:v.date,name:v.name,dose:v.dose});}));
  const trans=state.transactions.filter(t=>monthKey(t.date)===month),expenses=state.expenses.filter(e=>monthKey(e.date)===month);
  return {active,births,health,meds,vacc,trans,expenses,
    totalExpenses:expenses.reduce((s,e)=>s+safeNumber(e.amount),0),
    sales:trans.filter(t=>t.type==='بيع').reduce((s,t)=>s+safeNumber(t.amount),0),
    purchases:trans.filter(t=>t.type==='شراء').reduce((s,t)=>s+safeNumber(t.amount),0)};
}

function downloadBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function exportCSV(){
  const r=reportData(reportMonth),rows=[['تقرير الجليديه',reportMonth],[],['النوع','التفاصيل','التاريخ','المبلغ/العدد']];
  r.births.forEach(x=>rows.push(['ولادة',`الأم ${x.mother} - ${x.type}`,x.date,x.count]));
  r.health.forEach(x=>rows.push(['صحة',`${x.animal} - ${x.diagnosis||''} - ${x.severity||''}`,x.date,'']));
  r.trans.forEach(x=>rows.push([x.type,animalById(x.animalId)?.customId||'',x.date,x.amount]));
  r.expenses.forEach(x=>rows.push(['مصروف',x.category,x.date,x.amount]));
  const csv='\uFEFF'+rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`aljalidiyah-${reportMonth}.csv`);
}
function exportExcel(){
  if(!window.XLSX){showToast('تعذر تحميل أداة Excel');return;}
  const r=reportData(reportMonth),wb=XLSX.utils.book_new();
  const animals=state.animals.map(a=>({الرقم:a.customId,النوع:animalTypeName(a.type),الجنس:a.gender,الاسم:a.name,السلالة:a.breed,الميلاد:a.birthDate,العمر:calcAge(a.birthDate),الوزن:a.weight,الحالة:a.status,الصحة:a.healthStatus}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(animals),'الحيوانات');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.births),'الولادات');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.health),'الصحة');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.trans.map(t=>({...t,animal:animalById(t.animalId)?.customId||''}))),'البيع والشراء');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.expenses),'المصاريف');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(state.medicineInventory),'مخزون الأدوية');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(state.feedInventory),'مخزون الأعلاف');
  XLSX.writeFile(wb,`aljalidiyah-${reportMonth}.xlsx`);
}
function printReport(){
  const html=document.getElementById('printReport')?.innerHTML||'',w=window.open('','_blank');
  w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><title>تقرير الجليديه ${reportMonth}</title><style>body{font-family:Arial;padding:30px;color:#3E2B1E}.report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric-card,.list-item{border:1px solid #ddd;border-radius:12px;padding:12px}.big{font-size:22px;font-weight:bold}.small{font-size:12px}.kv{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:7px}</style></head><body><h1>الجليديه</h1><h3>تقرير ${reportMonth}</h3>${html}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300);

function exportBackup(){

    }
  `;
  document.head.appendChild(st);
})();

function allAnimalTypes(){
  return Object.entries(state?.settings?.typeLabels||{}).map(([id,v])=>({
    id,
    male:v?.m||id,
    female:v?.f||id,
    plural:v?.plural||v?.f||id,
    prefix:state.settings.idPrefixes?.[id]||id.toUpperCase(),
    gestation:safeNumber(state.settings.gestation?.[id])||150
  }));
}
function getAnimalType(type){ return allAnimalTypes().find(x=>x.id===type)||{id:type,male:type,female:type,plural:type,prefix:type.toUpperCase(),gestation:150}; }
function genderedTypeName(type,gender){ const t=getAnimalType(type); return gender==='ذكر'?t.male:t.female; }
animalTypeName = function(type){ return getAnimalType(type).plural; };
typeLabel = function(type,plural){ const t=getAnimalType(type); return plural?t.plural:t.female; };
animalLabel = function(a){ return `${genderedTypeName(a.type,a.gender)} ${a.customId}${a.name?' ('+a.name+')':''}`; };

function typeOptions(selected){
  return allAnimalTypes().map(t=>`<option value="${esc(t.id)}" ${t.id===selected?'selected':''}>${esc(t.plural)}</option>`).join('');
}
function updateAnimalTypePreview(){
  const type=document.getElementById('fType')?.value, gender=document.getElementById('fGender')?.value;
  const box=document.getElementById('animalTypePreview');
  if(box&&type&&gender) box.innerHTML=`سيُسجل الحيوان كـ: <b>${esc(genderedTypeName(type,gender))}</b>`;
}
function previewAnimalPhoto(input){
  const wrap=document.getElementById('animalPhotoPreview');
  const file=input?.files?.[0];
  if(!wrap)return;
  if(!file){wrap.innerHTML='';return;}
  const u=URL.createObjectURL(file);
  wrap.innerHTML=`<img src="${u}" style="width:82px;height:82px;object-fit:cover;border-radius:12px;border:1px solid var(--line)">`;
}

function profileGroup(v){

}

  if(g==='care') return `<div class="section-title">الصور</div>${tabPhotos(a)}<div class="section-title">الحالات الصحية</div>${tabHealth(a)}<div class="section-title">الأدوية</div>${tabMeds(a)}<div class="section-title">التطعيمات</div>${tabVacc(a)}<div class="section-title">الوزن</div>${tabWeight(a)}`;

/* المهام: الضغط يفتح الهدف، والإنجاز يحتاج تأكيد */
const TASK_CATEGORIES=['عام','متابعة','صحة','دواء','تطعيم','تلقيح','حمل','ولادة','وزن','مصاريف','أعلاف','مخزون أدوية'];
function taskCategoryIcon(c){return({عام:'✅',متابعة:'⏱️',صحة:'🩺',دواء:'💊',تطعيم:'💉',تلقيح:'🐂',حمل:'🤰',ولادة:'🍼',وزن:'⚖️',مصاريف:'💳',أعلاف:'🌾','مخزون أدوية':'💊'})[c]||'✅';}
function taskDueAt(t){ if(t.dueAt)return new Date(t.dueAt); return new Date((t.dueDate||todayISO())+'T'+(t.dueTime||'23:59')); }
function taskTargetTab(category){return({متابعة:'followups',صحة:'health',دواء:'meds',تطعيم:'vacc',تلقيح:'breeding',حمل:'pregnancy',ولادة:'births',وزن:'weight'})[category]||'info';}
function openTaskTarget(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  if(t.animalId&&animalById(t.animalId)){profileTab=taskTargetTab(t.category);navigate('animalProfile',{id:t.animalId});return;}
  const v=({مصاريف:'expenses',أعلاف:'feedInventory','مخزون أدوية':'medicineInventory',ولادة:'births'})[t.category]||'tasks';
  navigate(v);
}
function openCompleteTask(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  openModal('تأكيد إنجاز المهمة',`
    <div class="notice"><b>${esc(t.title)}</b><br>${t.animalId&&animalById(t.animalId)?esc(animalLabel(animalById(t.animalId))):esc(t.category||'عام')}</div>
    <div class="field"><label>ملاحظة (اختياري)</label><textarea id="taskDoneNote" placeholder="مثال: تم التنفيذ بدون ملاحظات"></textarea></div>
    <button class="btn block" onclick="completeTaskConfirmed('${id}')">نعم، تمت المهمة</button>
    <button class="btn block ghost" style="margin-top:7px" onclick="closeModal()">رجوع</button>`);
}
function completeTaskConfirmed(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  t.done=true;t.completedAt=new Date().toISOString();t.completedNote=document.getElementById('taskDoneNote')?.value.trim()||'';
  const repeat=t.repeat||t.type||'مرة واحدة';
  if(repeat!=='مرة واحدة'){
    const d=taskDueAt(t);d.setDate(d.getDate()+(repeat==='يوميًا'?1:7));
    state.tasks.push({...t,id:uid('t'),done:false,completedAt:null,completedNote:'',dueDate:localISODate(d),dueTime:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,dueAt:d.toISOString()});
  }
  saveState();closeModal();showToast('تم تأكيد إنجاز المهمة');renderView();
}
toggleTaskDone = function(id){ openCompleteTask(id); };
deleteTask = function(id){ if(!confirm('حذف هذه المهمة؟'))return;state.tasks=state.tasks.filter(x=>x.id!==id);saveState();renderView(); };

function taskItem(t,compact=false){
  const a=t.animalId?animalById(t.animalId):null, due=taskDueAt(t), late=!t.done&&due<Date.now(), cat=t.category||'عام';
  return `<div class="simple-card ${t.done?'':'clickable'}" style="${late?'border-color:rgba(193,68,59,.28)':''}">
    <div class="simple-head">
      <div style="flex:1" onclick="${t.done?'':'openTaskTarget(\''+t.id+'\')'}">
        <div class="simple-title">${taskCategoryIcon(cat)} ${esc(t.title)}</div>
        <div class="simple-sub">${a?esc(animalLabel(a)):(cat!=='عام'?esc(cat):'مهمة عامة')} · ${fmtDateTime(due.toISOString())}${late?' · متأخرة':''}</div>
      </div>
      ${t.done?`<span class="chip soft">تمت</span>`:`<div class="task-actions"><button class="task-open-btn" onclick="openTaskTarget('${t.id}')">فتح</button><button class="task-done-btn" onclick="openCompleteTask('${t.id}')">تم</button></div>`}
    </div>
    ${t.done&&t.completedNote?`<div class="simple-sub">${esc(t.completedNote)}</div>`:''}
    ${!compact?`<div style="text-align:left;margin-top:5px"><button class="btn small ghost" onclick="deleteTask('${t.id}')">حذف</button></div>`:''}
  </div>`;
}
renderTasks = function(){
  const pending=state.tasks.filter(t=>!t.done).sort((a,b)=>taskDueAt(a)-taskDueAt(b)), done=state.tasks.filter(t=>t.done).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));
  const now=new Date(),today=todayISO();
  const overdue=pending.filter(t=>taskDueAt(t)<now&&t.dueDate!==today), todayList=pending.filter(t=>t.dueDate===today), upcoming=pending.filter(t=>t.dueDate>today);
  return `<div class="section-title">المهام</div><button class="btn block" onclick="openAddTask()">+ إضافة مهمة</button>
    ${overdue.length?`<div class="section-title" style="font-size:14px">متأخرة (${overdue.length})</div>${overdue.map(t=>taskItem(t)).join('')}`:''}
    <div class="section-title" style="font-size:14px">اليوم (${todayList.length})</div>${todayList.length?todayList.map(t=>taskItem(t)).join(''):`<div class="empty">لا توجد مهام اليوم</div>`}
    ${upcoming.length?`<div class="section-title" style="font-size:14px">قادمة</div>${upcoming.slice(0,12).map(t=>taskItem(t)).join('')}`:''}
    ${done.length?`<details class="simple-details"><summary>المهام المكتملة (${done.length}) ▾</summary><div style="height:8px"></div>${done.slice(0,15).map(t=>taskItem(t)).join('')}</details>`:''}`;
};
openAddTask = function(){
  openModal('إضافة مهمة',`
    <div class="field"><label>المهمة</label><input id="tTitle" placeholder="مثال: فحص حرارة C-018"></div>
    <div class="field-row"><div class="field"><label>النوع</label><select id="tCategory">${TASK_CATEGORIES.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>الحيوان (اختياري)</label><select id="tAnimal"><option value="">— بدون —</option>${state.animals.filter(a=>a.status==='موجود في المزرعة').map(a=>`<option value="${a.id}">${esc(animalLabel(a))}</option>`).join('')}</select></div></div>
    <div class="field-row"><div class="field"><label>التاريخ</label><input type="date" id="tDue" value="${todayISO()}"></div><div class="field"><label>الوقت</label><input type="time" id="tTime" value="${nowTimeStr()}"></div></div>
    <div class="field"><label>التكرار</label><select id="tRepeat"><option>مرة واحدة</option><option>يوميًا</option><option>أسبوعيًا</option></select></div>
    <button class="btn block" onclick="saveTask()">حفظ المهمة</button>`);
};
saveTask = function(){
  const title=document.getElementById('tTitle').value.trim();if(!title){showToast('اكتب المهمة');return;}
  const date=document.getElementById('tDue').value,time=document.getElementById('tTime').value||'09:00';
  const t={id:uid('t'),title,category:document.getElementById('tCategory').value,animalId:document.getElementById('tAnimal').value||null,dueDate:date,dueTime:time,dueAt:new Date(`${date}T${time}`).toISOString(),repeat:document.getElementById('tRepeat').value,type:document.getElementById('tRepeat').value,done:false};
  state.tasks.push(t);saveState();closeModal();showToast('تمت إضافة المهمة');renderView();
};

/* التنبيهات: الضغط يفتح الشيء الصحيح */
alertRow = function(n){
  let action='';
  if(n.animalId) action=`navigate('animalProfile',{id:'${n.animalId}'})`;
  else if(n.taskId) action=`openTaskTarget('${n.taskId}')`;
  else if(n.kind==='مخزون علف') action=`navigate('feedInventory')`;
  else if(['مخزون دواء','انتهاء دواء'].includes(n.kind)) action=`navigate('medicineInventory')`;
  return `<div class="alert ${n.level}" ${action?`onclick="${action}" style="cursor:pointer"`:''}><div class="dot ${n.level}"></div><div class="alert-text">${esc(n.text)}</div></div>`;
};

    <div class="field-row"><div class="field"><label>بادئة الرقم</label><input id="atPrefix" value="${esc(old?.prefix||'')}"></div><div class="field"><label>مدة الحمل بالأيام</label><input type="number" id="atGest" value="${old?.gestation||150}"></div></div>

function saveAnimalType(typeId=''){

  state.settings.idPrefixes[id]=document.getElementById('atPrefix').value.trim()||p.slice(0,2).toUpperCase();

}
function deleteAnimalType(typeId){
  if(state.animals.some(a=>a.type===typeId)){showToast('لا يمكن حذف النوع لأن هناك حيوانات مسجلة تحته');return;}
  if(!confirm('حذف هذا النوع من الإعدادات؟'))return;
  delete state.settings.typeLabels[typeId];delete state.settings.idPrefixes[typeId];delete state.settings.gestation[typeId];saveState();renderView();
}
renderSettings = function(){
  const s=state.settings;

    <div class="section-title">أنواع الحلال</div>

    ${allAnimalTypes().map(t=>`<div class="type-settings-row"><div><b>${esc(t.plural)}</b><div class="meta">أنثى: ${esc(t.female)} · ذكر: ${esc(t.male)} · ${esc(t.prefix)} · حمل ${t.gestation} يوم</div></div><div class="action-line"><button class="btn small ghost" onclick="openAnimalTypeEditor('${t.id}')">تعديل</button><button class="btn small ghost" onclick="deleteAnimalType('${t.id}')">حذف</button></div></div>`).join('')}

/* ============================= الجليديه V4 — حماية الصور الخاصة ============================= */
const PRIVATE_MEDIA_TTL_SECONDS = 900; // رابط مؤقت لمدة 15 دقيقة فقط
let privateMediaRefreshTimer = null;

function inferFarmMediaPath(url){
  if(!url) return null;
  const s=String(url);
  const markers=[
    '/storage/v1/object/public/farm-media/',
    '/storage/v1/object/sign/farm-media/',
    '/storage/v1/object/authenticated/farm-media/'
  ];
  for(const marker of markers){
    const i=s.indexOf(marker);
    if(i>=0){
      const raw=s.slice(i+marker.length).split('?')[0];
      try{return decodeURIComponent(raw);}catch(_){return raw;}
    }
  }
  return null;
}

function ensurePrivateMediaPaths(s){
  if(!s) return s;
  (s.animals||[]).forEach(a=>{
    (a.photos||[]).forEach(p=>{ if(!p.path) p.path=inferFarmMediaPath(p.url); });
    (a.births||[]).forEach(b=>(b.newborns||[]).forEach(n=>{ if(!n.photoPath) n.photoPath=inferFarmMediaPath(n.photoUrl); }));
    (a.healthCases||[]).forEach(h=>(h.photos||[]).forEach(p=>{ if(!p.path) p.path=inferFarmMediaPath(p.url); }));
  });
  (s.expenses||[]).forEach(e=>{ if(!e.receiptPath) e.receiptPath=inferFarmMediaPath(e.receiptUrl); });
  (s.medicineInventory||[]).forEach(i=>{ if(!i.photoPath) i.photoPath=inferFarmMediaPath(i.photoUrl); });
  return s;
}

async function privateSignedUrl(path){
  if(!path) return '';
  const {data,error}=await supabaseClient.storage.from(MEDIA_BUCKET).createSignedUrl(path,PRIVATE_MEDIA_TTL_SECONDS);
  if(error){ console.warn('تعذر إنشاء رابط خاص للصورة',path,error.message); return ''; }
  return data?.signedUrl||'';
}

async function hydratePrivateMediaUrls(s){
  if(!s||!session.user) return;
  ensurePrivateMediaPaths(s);
  const refs=[];
  const add=(path,setter)=>{ if(path) refs.push({path,setter}); };

  (s.animals||[]).forEach(a=>{
    (a.photos||[]).forEach(p=>add(p.path,u=>p.url=u));
    (a.births||[]).forEach(b=>(b.newborns||[]).forEach(n=>add(n.photoPath,u=>n.photoUrl=u)));
    (a.healthCases||[]).forEach(h=>(h.photos||[]).forEach(p=>add(p.path,u=>p.url=u)));
  });
  (s.expenses||[]).forEach(e=>add(e.receiptPath,u=>e.receiptUrl=u));
  (s.medicineInventory||[]).forEach(i=>add(i.photoPath,u=>i.photoUrl=u));

  const unique=[...new Set(refs.map(r=>r.path))];
  const signed={};
  for(let i=0;i<unique.length;i+=12){
    const chunk=unique.slice(i,i+12);
    const result=await Promise.all(chunk.map(async p=>[p,await privateSignedUrl(p)]));
    result.forEach(([p,u])=>{ if(u) signed[p]=u; });
  }
  refs.forEach(r=>{ if(signed[r.path]) r.setter(signed[r.path]); });

  (s.animals||[]).forEach(a=>{
    const main=(a.photos||[]).find(p=>p.main)||(a.photos||[])[0];
    if(main?.url) a.photoUrl=main.url;
  });
}

function stateForPrivateStorage(s){
  const c=JSON.parse(JSON.stringify(s||{}));
  ensurePrivateMediaPaths(c);
  (c.animals||[]).forEach(a=>{
    let hasPrivateMain=false;
    (a.photos||[]).forEach(p=>{ if(p.path){ if(p.main)hasPrivateMain=true; p.url=''; } });
    if(hasPrivateMain) a.photoUrl='';
    (a.births||[]).forEach(b=>(b.newborns||[]).forEach(n=>{ if(n.photoPath)n.photoUrl=''; }));
    (a.healthCases||[]).forEach(h=>(h.photos||[]).forEach(p=>{ if(p.path)p.url=''; }));
  });
  (c.expenses||[]).forEach(e=>{ if(e.receiptPath)e.receiptUrl=''; });
  (c.medicineInventory||[]).forEach(i=>{ if(i.photoPath)i.photoUrl=''; });
  return c;
}

/* الحفظ السحابي: نخزن مسار الصورة فقط، وليس الرابط المؤقت */
saveState = function(){
  clearTimeout(saveTimer);
  syncState.saving=true;
  saveTimer=setTimeout(async()=>{
    if(!session.user)return;
    try{
      const payload=stateForPrivateStorage(state);
      const {error}=await supabaseClient.from('farm_state').upsert({
        user_id:session.user.id,state_json:payload,updated_at:new Date().toISOString()
      },{onConflict:'user_id'});
      if(error)throw error;
      syncState.saving=false;syncState.lastOk=new Date();syncState.lastError=null;
      const el=document.getElementById('syncStatus');if(el){el.className='sync-status ok';el.textContent='محفوظ ✓';}
    }catch(e){
      console.error(e);syncState.saving=false;syncState.lastError=e.message;
      const el=document.getElementById('syncStatus');if(el){el.className='sync-status err';el.textContent='تعذر الحفظ';}
      showToast('تعذر الحفظ السحابي، تحقق من الاتصال');
    }
  },300);
};

/* التحميل: بعد جلب البيانات ننشئ روابط قصيرة العمر فقط للمستخدم المسجل */
loadState = async function(){
  if(!session.user){state=defaultState();return;}
  try{
    const {data,error}=await supabaseClient.from('farm_state').select('state_json').eq('user_id',session.user.id).maybeSingle();
    if(error)throw error;
    if(data?.state_json) state=normalizeState(data.state_json);
    else{
      state=defaultState();
      const {error:upErr}=await supabaseClient.from('farm_state').upsert({user_id:session.user.id,state_json:stateForPrivateStorage(state),updated_at:new Date().toISOString()},{onConflict:'user_id'});
      if(upErr)throw upErr;
    }
    await hydratePrivateMediaUrls(state);
    if(privateMediaRefreshTimer)clearInterval(privateMediaRefreshTimer);
    privateMediaRefreshTimer=setInterval(async()=>{
      if(!session.user||!state)return;
      await hydratePrivateMediaUrls(state);
      if(!document.getElementById('modalBackdrop'))renderView();
    },10*60*1000); // تجديد قبل انتهاء الرابط
  }catch(e){
    console.error(e);state=defaultState();syncState.lastError=e.message;showToast('تعذر تحميل بيانات الجليديه من قاعدة البيانات');
  }
};

/* رفع الصور: لا يتم إنشاء Public URL نهائيًا */
uploadMedia = async function(file,folder){
  if(!file)return null;
  if(!session.user)throw new Error('يجب تسجيل الدخول');
  const blob=await compressImage(file);
  const path=`${session.user.id}/${folder}/${Date.now()}_${fileNameSafe(file.name).replace(/\.[^.]+$/,'.jpg')}`;
  const {error}=await supabaseClient.storage.from(MEDIA_BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:false});
  if(error)throw error;
  const url=await privateSignedUrl(path);
  if(!url)throw new Error('تم رفع الصورة لكن تعذر إنشاء رابط العرض الخاص');
  return {url,path};
};

/* النسخة الاحتياطية لا تحتوي روابط مشاهدة مؤقتة */
exportBackup = function(){
  const payload={app:'الجليديه',version:4,exportedAt:new Date().toISOString(),state:stateForPrivateStorage(state)};
  downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),`aljalidiyah-backup-${todayISO()}.json`);
};
importBackup = async function(){
  const file=document.getElementById('backupFile')?.files?.[0];if(!file){showToast('اختر ملف النسخة الاحتياطية');return;}
  if(!confirm('سيتم استبدال البيانات الحالية بالنسخة المختارة. متابعة؟'))return;
  try{
    const obj=JSON.parse(await file.text());state=normalizeState(obj.state||obj);ensurePrivateMediaPaths(state);await hydratePrivateMediaUrls(state);saveState();showToast('تمت استعادة النسخة');navigate('dashboard');
  }catch(e){console.error(e);showToast('ملف النسخة غير صالح');}
};

  return `<div class="notice ok"><b>🔒 الصور خاصة</b><br>الصور والفواتير مخزنة في Private Storage ولا تُعرض إلا بعد تسجيل الدخول. روابط العرض مؤقتة وتتجدد تلقائيًا.</div>`+renderSettingsV3PrivateBase();
};
