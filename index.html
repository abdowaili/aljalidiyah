<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>الجليديه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#DCC9A0;
    --sand-light:#EFE4C9;
    --brown:#3E2B1E;
    --brown-soft:#7A6650;
    --olive:#6E7F45;
    --olive-dark:#54622F;
    --cream:#FBF6EC;
    --white:#FFFFFF;
    --red:#C1443B;
    --orange:#D9873D;
    --yellow:#C79A2A;
    --green:#5E8A52;
    --radius:16px;
    --shadow:0 3px 14px rgba(62,43,30,.14);
    --line:#E4D8BE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--brown);
    font-family:'Cairo',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button, input, select, textarea{font-family:inherit;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:78px;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;
    background:var(--brown);color:var(--cream);
    padding:14px 16px 12px;
    display:flex;align-items:center;justify-content:space-between;
    box-shadow:var(--shadow);
  }
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand .tag{
    background:var(--olive);color:var(--cream);
    font-weight:800;font-size:15px;padding:4px 10px;border-radius:8px;
    letter-spacing:.5px;
  }
  .brand .sub{font-size:11px;color:var(--sand);opacity:.85;}
  .topbar-actions{display:flex;gap:10px;align-items:center;}
  .icon-btn{
    background:rgba(255,255,255,.08);border:none;color:var(--cream);
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;cursor:pointer;position:relative;
  }
  .icon-btn .badge{
    position:absolute;top:-3px;left:-3px;background:var(--red);color:#fff;
    font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;padding:0 3px;
  }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    max-width:520px;margin:0 auto;
    background:var(--white);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 10px rgba(62,43,30,.08);
  }
  .navbtn{
    background:none;border:none;display:flex;flex-direction:column;align-items:center;
    gap:2px;color:var(--brown-soft);font-size:10.5px;font-weight:600;
    padding:6px 8px;border-radius:10px;flex:1;cursor:pointer;
  }
  .navbtn .ic{font-size:19px;}
  .navbtn.active{color:var(--olive-dark);background:var(--sand-light);}

  /* ---------- Generic layout ---------- */
  .view{padding:14px 14px 10px;}
  .section-title{font-size:17px;font-weight:800;margin:18px 0 10px;color:var(--brown);}
  .section-title:first-child{margin-top:2px;}
  .muted{color:var(--brown-soft);font-size:13px;}
  .row{display:flex;gap:10px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

  /* ---------- Stat cards ---------- */
  .stat-card{
    background:var(--white);border-radius:var(--radius);padding:12px 10px;
    box-shadow:var(--shadow);text-align:center;border-bottom:3px solid var(--olive);
  }
  .stat-card .num{font-size:22px;font-weight:800;color:var(--brown);display:block;line-height:1.2;}
  .stat-card .lbl{font-size:11.5px;color:var(--brown-soft);}
  .stat-card.warn{border-bottom-color:var(--orange);}
  .stat-card.danger{border-bottom-color:var(--red);}
  .stat-card.ok{border-bottom-color:var(--green);}

  /* ---------- Alerts ---------- */
  .alert{
    display:flex;gap:10px;align-items:flex-start;
    background:var(--white);border-radius:12px;padding:10px 12px;margin-bottom:8px;
    box-shadow:var(--shadow);border-right:5px solid var(--brown-soft);
    cursor:pointer;
  }
  .alert.red{border-right-color:var(--red);}
  .alert.orange{border-right-color:var(--orange);}
  .alert.yellow{border-right-color:var(--yellow);}
  .alert.green{border-right-color:var(--green);}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;}
  .dot.red{background:var(--red);}
  .dot.orange{background:var(--orange);}
  .dot.yellow{background:var(--yellow);}
  .dot.green{background:var(--green);}
  .alert-text{font-size:13.5px;line-height:1.5;}
  .empty{
    text-align:center;color:var(--brown-soft);font-size:13.5px;
    padding:26px 10px;background:var(--white);border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  /* ---------- Tag-style animal card ---------- */
  .tag-card{
    background:var(--white);border-radius:14px;box-shadow:var(--shadow);
    padding:12px;position:relative;margin-bottom:12px;border-right:6px solid var(--green);
    display:flex;gap:12px;cursor:pointer;
  }
  .tag-card::before{
    content:'';position:absolute;top:10px;right:-3px;width:9px;height:9px;
    background:var(--cream);border:2px solid var(--sand);border-radius:50%;
  }
  .tag-card.status-yellow{border-right-color:var(--yellow);}
  .tag-card.status-orange{border-right-color:var(--orange);}
  .tag-card.status-red{border-right-color:var(--red);}
  .tag-thumb{
    width:56px;height:56px;border-radius:10px;background:var(--sand-light);
    display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;
    overflow:hidden;
  }
  .tag-thumb img{width:100%;height:100%;object-fit:cover;}
  .tag-info{flex:1;min-width:0;}
  .tag-top{display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .tag-id{font-weight:800;font-size:14.5px;}
  .tag-name{color:var(--brown-soft);font-size:12.5px;}
  .tag-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;}
  .chip{
    background:var(--sand-light);color:var(--brown);font-size:11px;font-weight:600;
    padding:3px 8px;border-radius:20px;
  }
  .chip.soft{background:transparent;border:1px solid var(--line);}

  /* ---------- Buttons ---------- */
  .btn{
    background:var(--olive);color:#fff;border:none;border-radius:12px;
    padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;justify-content:center;
  }
  .btn:active{background:var(--olive-dark);}
  .btn.block{width:100%;}
  .btn.ghost{background:transparent;color:var(--olive-dark);border:1.5px solid var(--olive);}
  .btn.small{padding:8px 12px;font-size:12.5px;border-radius:10px;}
  .btn.danger{background:var(--red);}
  .fab{
    position:fixed;bottom:88px;left:50%;transform:translateX(-50%);
    max-width:520px;
  }
  .fab-inner{position:relative;left:190px;}

  /* ---------- Form elements ---------- */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--brown-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
    background:var(--white);font-size:14px;color:var(--brown);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--olive);border-color:var(--olive);}
  .field textarea{resize:vertical;min-height:60px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(62,43,30,.45);z-index:100;
    display:flex;align-items:flex-end;
  }
  .modal-sheet{
    background:var(--cream);width:100%;max-width:520px;margin:0 auto;
    border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));
    animation:slideUp .22s ease-out;
  }
  @keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-handle{width:38px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 12px;}
  .modal-title{font-size:16.5px;font-weight:800;margin-bottom:14px;}
  .modal-close{
    position:absolute;top:14px;left:14px;background:var(--sand-light);border:none;
    width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;color:var(--brown);
  }

  /* ---------- Tabs ---------- */
  .tabbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;}
  .tabbar::-webkit-scrollbar{display:none;}
  .tabitem{
    flex:none;background:var(--white);border:1.5px solid var(--line);color:var(--brown-soft);
    padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .tabitem.active{background:var(--olive);border-color:var(--olive);color:#fff;}

  /* ---------- Profile header ---------- */
  .profile-head{
    background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:14px;
  }
  .profile-thumb{
    width:76px;height:76px;border-radius:14px;background:var(--sand-light);
    display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;flex:none;
  }
  .profile-thumb img{width:100%;height:100%;object-fit:cover;}
  .profile-name{font-size:17px;font-weight:800;}
  .profile-sub{font-size:12.5px;color:var(--brown-soft);margin-top:2px;}

  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--brown-soft);}
  .kv .v{font-weight:700;}

  .list-item{
    background:var(--white);border-radius:12px;padding:11px 13px;margin-bottom:9px;
    box-shadow:var(--shadow);font-size:13px;
  }
  .list-item .top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:3px;}
  .list-item .top .date{color:var(--brown-soft);font-weight:600;font-size:12px;}

  .progress-wrap{background:var(--sand-light);border-radius:20px;height:10px;overflow:hidden;margin:8px 0;}
  .progress-bar{height:100%;background:var(--olive);border-radius:20px;}

  .timeline{position:relative;padding-right:18px;}
  .timeline::before{content:'';position:absolute;right:5px;top:4px;bottom:4px;width:2px;background:var(--line);}
  .tl-item{position:relative;margin-bottom:16px;}
  .tl-item::before{content:'';position:absolute;right:-18px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--olive);}
  .tl-date{font-size:11.5px;color:var(--brown-soft);font-weight:700;}
  .tl-text{font-size:13.5px;margin-top:2px;}

  .search-overlay{
    position:fixed;inset:0;background:var(--cream);z-index:90;max-width:520px;margin:0 auto;
    display:flex;flex-direction:column;
  }
  .search-input-wrap{padding:14px;display:flex;gap:8px;background:var(--brown);}
  .search-input-wrap input{flex:1;border-radius:10px;border:none;padding:11px 12px;font-size:14px;}

  .login-wrap{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:30px;background:linear-gradient(180deg, var(--brown) 0%, var(--brown) 40%, var(--cream) 40%);
  }
  .login-card{
    background:var(--white);border-radius:20px;box-shadow:var(--shadow);padding:28px 22px;width:100%;max-width:360px;
  }
  .login-logo{text-align:center;margin-bottom:22px;}
  .login-logo .tag{
    display:inline-block;background:var(--olive);color:#fff;font-weight:800;font-size:22px;
    padding:8px 18px;border-radius:12px;letter-spacing:.5px;
  }
  .login-logo .sub{color:var(--sand-light);font-size:12.5px;margin-top:8px;}
  .hint{font-size:11.5px;color:var(--brown-soft);text-align:center;margin-top:10px;line-height:1.6;}

  .weight-chart{width:100%;height:110px;}
  .toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--brown);color:#fff;
    padding:10px 18px;border-radius:24px;font-size:13px;font-weight:600;z-index:200;box-shadow:var(--shadow);
    max-width:90%;text-align:center;
  }
  .drawer-list .list-item{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .drawer-list .list-item .ic{font-size:18px;}

  /* ============================= V2 ENHANCEMENTS ============================= */
  .attention-wrap{background:linear-gradient(180deg,rgba(193,68,59,.08),transparent);border:1px solid rgba(193,68,59,.14);border-radius:18px;padding:12px;margin-bottom:10px}
  .attention-title{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;font-weight:800;margin-bottom:8px}
  .attention-title .count{background:var(--red);color:white;border-radius:20px;padding:2px 8px;font-size:11px}
  .quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .quick-action{border:1px solid var(--line);background:var(--white);border-radius:12px;padding:9px 6px;font-size:11.5px;font-weight:700;color:var(--brown);cursor:pointer;box-shadow:0 1px 6px rgba(62,43,30,.06)}
  .quick-action .qa-ic{display:block;font-size:20px;margin-bottom:3px}
  .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .photo-card{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--sand-light);border:1px solid var(--line)}
  .photo-card img{width:100%;height:100%;object-fit:cover;display:block}
  .photo-card .photo-actions{position:absolute;inset:auto 4px 4px 4px;display:flex;gap:4px}
  .photo-mini-btn{border:none;border-radius:8px;background:rgba(62,43,30,.82);color:#fff;font-size:10px;padding:5px 7px;cursor:pointer;flex:1}
  .photo-main{position:absolute;top:5px;right:5px;background:var(--olive);color:#fff;border-radius:8px;padding:3px 6px;font-size:9.5px;font-weight:800}
  .upload-box{border:1.5px dashed var(--olive);background:rgba(110,127,69,.06);padding:14px;border-radius:14px;text-align:center;margin-bottom:12px}
  .upload-box input[type=file]{width:100%;margin-top:8px}
  .notice{padding:10px 12px;border-radius:12px;background:var(--sand-light);font-size:12.5px;line-height:1.6;margin-bottom:10px}
  .notice.danger{background:rgba(193,68,59,.09);color:#8B2F29}
  .notice.ok{background:rgba(94,138,82,.10);color:#416339}
  .stack{display:flex;flex-direction:column;gap:8px}
  .subcard{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px}
  .subcard-title{font-weight:800;font-size:13.5px;margin-bottom:8px}
  .money{font-weight:800;font-variant-numeric:tabular-nums}
  .table-scroll{overflow:auto;background:var(--white);border-radius:14px;border:1px solid var(--line)}
  .mini-table{width:100%;border-collapse:collapse;min-width:540px;font-size:12px}
  .mini-table th,.mini-table td{padding:9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  .mini-table th{background:var(--sand-light);font-weight:800}
  .pill-row{display:flex;gap:6px;flex-wrap:wrap}
  .metric-card{background:var(--white);border-radius:14px;padding:12px;border:1px solid var(--line);box-shadow:0 1px 7px rgba(62,43,30,.06)}
  .metric-card .big{font-size:22px;font-weight:800}
  .metric-card .small{font-size:11.5px;color:var(--brown-soft)}
  .report-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .nav-section{font-size:11px;color:var(--brown-soft);font-weight:800;margin:14px 4px 7px}
  .section-link{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--white);padding:12px;border-radius:12px;margin-bottom:8px;border:1px solid var(--line);cursor:pointer}
  .section-link .left{display:flex;align-items:center;gap:10px}
  .section-link .ic{font-size:20px}
  .file-preview{margin-top:8px;font-size:11.5px;color:var(--brown-soft)}
  .newborn-box{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .newborn-title{font-weight:800;margin-bottom:8px}
  .status-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .action-line{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .action-line .btn{flex:1;min-width:120px}
  .modal-sheet.wide{max-width:720px}
  .sync-status{font-size:10px;color:var(--sand);opacity:.9}
  .sync-status.ok{color:#D9F0D3}
  .sync-status.err{color:#FFD1CE}
  .sticky-save{position:sticky;bottom:0;padding-top:10px;background:linear-gradient(transparent,var(--cream) 25%)}
  @media (min-width:700px){
    #app{max-width:900px}
    .bottomnav{max-width:900px}
    .modal-sheet{max-width:760px}
    .search-overlay{max-width:900px}
    .grid3{grid-template-columns:repeat(6,1fr)}
    .quick-actions{grid-template-columns:repeat(6,1fr)}
    .report-grid{grid-template-columns:repeat(4,1fr)}
  }

</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const SUPABASE_URL = 'https://ablltpquylsxxsyywiwg.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_QbJcjR9USu2jbwx7T_o6FA_e0RhnXWz';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);


/* ============================= STATE ============================= */
let state = null;
let session = { loggedIn:false, user:null, view:'dashboard', params:{} };
let saveTimer = null;




/* ============================= HELPERS ============================= */
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('ar-OM',{day:'numeric',month:'long',year:'numeric'}); }
function fmtDateTime(v){ if(!v) return '—'; const dt=new Date(v); return dt.toLocaleString('ar-OM',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); }
function isDueDateTime(v){ return !!v && new Date(v).getTime() <= Date.now(); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function arNum(n, s, du, pl, ma){
  if(n<=0) return null;
  if(n===1) return s;
  if(n===2) return du;
  if(n>=3 && n<=10) return n+' '+pl;
  return n+' '+ma;
}
function calcAge(birth){
  if(!birth) return '—';
  const b=new Date(birth+'T00:00:00'), n=new Date();
  let y=n.getFullYear()-b.getFullYear(), m=n.getMonth()-b.getMonth(), d=n.getDate()-b.getDate();
  if(d<0){ m--; d += new Date(n.getFullYear(), n.getMonth(), 0).getDate(); }
  if(m<0){ y--; m+=12; }
  const parts=[
    arNum(y,'سنة','سنتان','سنوات','سنة'),
    arNum(m,'شهر','شهران','أشهر','شهرًا'),
    arNum(d,'يوم','يومان','أيام','يومًا')
  ].filter(Boolean);
  return parts.length ? parts.join(' و') : 'أقل من يوم';
}

function animalById(id){ return state.animals.find(x=>x.id===id); }

function nextCustomId(type){
  const prefix = state.settings.idPrefixes[type] || type.toUpperCase();
  const nums = state.animals.filter(a=>a.type===type).map(a=>{
    const m = (a.customId||'').match(/(\d+)\s*$/);
    return m ? parseInt(m[1],10) : 0;
  });
  const max = nums.length ? Math.max(...nums) : 0;
  return prefix + '-' + String(max+1).padStart(3,'0');
}

function addTimeline(animal, text, type){
  animal.timeline = animal.timeline || [];
  animal.timeline.unshift({ date: todayISO(), text, type: type||'عام' });
}

function healthColor(status){
  return { 'سليم':'green', 'تحت المراقبة':'yellow', 'يحتاج علاج':'orange', 'حالة عاجلة':'red' }[status] || 'green';
}


function showToast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

/* ============================= MODAL ============================= */
function openModal(title, innerHtml, onMount){
  closeModal();
  const bd = document.createElement('div');
  bd.className='modal-backdrop'; bd.id='modalBackdrop';

/* ---- Weight ---- */
function tabWeight(a){
  const ws = a.weights||[];
  let chart = '';
  if(ws.length>=2){
    const vals = ws.map(w=>w.weight);
    const min = Math.min(...vals), max = Math.max(...vals);
    const w=300,h=90,pad=8;
    const pts = ws.map((w2,i)=>{
      const x = pad + (i/(ws.length-1))*(w-2*pad);
      const y = h-pad - ((w2.weight-min)/((max-min)||1))*(h-2*pad);
      return `${x},${y}`;
    }).join(' ');
    chart = `<svg class="weight-chart" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="#6E7F45" stroke-width="2.5"/></svg>`;
  }
  return `
    <button class="btn block" onclick="openAddWeight('${a.id}')">+ تسجيل وزن</button>
    ${chart?`<div class="list-item">${chart}</div>`:''}
    <div class="section-title" style="font-size:14.5px">سجل الوزن</div>
    ${ws.length ? ws.slice().reverse().map(w=>`
      <div class="list-item"><div class="top"><span>${w.weight} كجم</span><span class="date">${fmtDate(w.date)}</span></div>${w.notes?`<div class="muted">${esc(w.notes)}</div>`:''}</div>

}

function localISODate(d){
  d = d || new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
todayISO = function(){ return localISODate(new Date()); };
nowTimeStr = function(){ const d=new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
function monthKey(v){ if(!v) return ''; return String(v).slice(0,7); }
function dateTimeLocalValue(d){
  d = d || new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  const h=String(d.getHours()).padStart(2,'0'), mi=String(d.getMinutes()).padStart(2,'0');
  return `${y}-${m}-${day}T${h}:${mi}`;
}
function toISOFromLocal(v){ return v ? new Date(v).toISOString() : null; }
function fmtTime(v){
  if(!v) return '—';
  const d=new Date(v);
  return d.toLocaleTimeString('ar-OM',{hour:'numeric',minute:'2-digit'});
}
function fmtMoney(v){ return (Number(v)||0).toLocaleString('ar-OM',{minimumFractionDigits:3,maximumFractionDigits:3})+' ر.ع'; }
function safeNumber(v){ const n=Number(v); return Number.isFinite(n)?n:0; }
function daysUntilDate(v){ return v ? Math.ceil((new Date(v+'T23:59:59').getTime()-Date.now())/86400000) : null; }

async function compressImage(file,maxSide=1600,quality=.82){
  if(!file || !file.type.startsWith('image/')) return file;
  return await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=()=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        let w=img.width,h=img.height;
        const scale=Math.min(1,maxSide/Math.max(w,h));
        w=Math.round(w*scale); h=Math.round(h*scale);
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>resolve(blob||file),'image/jpeg',quality);
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function uploadMedia(file,folder){
  if(!file) return null;
  if(!session.user) throw new Error('يجب تسجيل الدخول');
  const blob=await compressImage(file);
  const path=`${session.user.id}/${folder}/${Date.now()}_${fileNameSafe(file.name).replace(/\.[^.]+$/,'.jpg')}`;
  const {error}=await supabaseClient.storage.from(MEDIA_BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:false});
  if(error) throw error;
  return {url:'',path};
}
async function deleteMedia(path){
  if(!path) return;
  const {error}=await supabaseClient.storage.from(MEDIA_BUCKET).remove([path]);
  if(error) console.warn(error);
}

computeNotifications = function(){
  const notes=[], today=todayISO(), now=Date.now();
  const add=(level,text,extra={})=>notes.push({level,text,...extra});
  state.animals.forEach(a=>{
    if(a.status!=='موجود في المزرعة') return;
    if(a.pregnancy?.active && a.pregnancy.dueDate){
      const rem=daysBetween(today,a.pregnancy.dueDate);
      if(rem<=30){
        const level=rem<=3?'red':rem<=7?'orange':'yellow';
        add(level,rem<0?`${animalLabel(a)} تجاوزت موعد الولادة المتوقع بـ ${-rem} يوم`:
          `${animalLabel(a)} متوقع ولادتها ${rem<=0?'اليوم':'خلال '+rem+' '+(rem===1?'يوم':'أيام')}`,
          {animalId:a.id,kind:'ولادة'});
      }
    }
    (a.breedings||[]).forEach(b=>{
      if(b.pregCheckDate && (b.pregnancyStatus||'pending')==='pending'){
        const rem=daysBetween(today,b.pregCheckDate);
        if(rem<=3){
          const text=rem<0?`${animalLabel(a)} فحص الحمل متأخر ${-rem} يوم`:
            rem===0?`${animalLabel(a)} موعد فحص الحمل اليوم`:
            `${animalLabel(a)} فحص الحمل خلال ${rem} أيام`;
          add(rem<0?'red':rem===0?'orange':'yellow',text,{animalId:a.id,kind:'فحص حمل'});
        }
      }
    });
    (a.followUps||[]).forEach(f=>{
      if(f.active && f.nextDue && new Date(f.nextDue).getTime()<=now){
        add('red',`${animalLabel(a)} — متابعة الآن: ${f.reason} · ${fmtTime(f.nextDue)}`,{animalId:a.id,kind:'متابعة'});
      }
    });
    (a.medications||[]).forEach(m=>{
      if(m.active && m.nextDoseAt && new Date(m.nextDoseAt).getTime()<=now){
        add('red',`${animalLabel(a)} — جرعة مستحقة: ${m.name} (${m.dose||''} ${m.doseUnit||''})`,{animalId:a.id,kind:'دواء'});
      }
    });
    (a.vaccinations||[]).forEach(v=>{
      if(v.nextDate){
        const rem=daysBetween(today,v.nextDate);
        if(rem>=0 && rem<=3) add(rem===0?'orange':'yellow',`${animalLabel(a)} لديها تطعيم ${v.name} ${rem===0?'اليوم':'خلال '+rem+' أيام'}`,{animalId:a.id,kind:'تطعيم'});
      }
    });
    if(a.healthStatus==='حالة عاجلة') add('red',`${animalLabel(a)} في حالة صحية عاجلة`,{animalId:a.id,kind:'صحة'});
    else if(a.healthStatus==='يحتاج علاج') add('orange',`${animalLabel(a)} يحتاج علاج`,{animalId:a.id,kind:'صحة'});
  });
  state.tasks.forEach(t=>{
    if(!t.done && t.dueDate){
      if(t.dueDate<today) add('red',`مهمة متأخرة: ${t.title}`,{taskId:t.id,kind:'مهمة'});
      else if(t.dueDate===today) add('orange',`مهمة اليوم: ${t.title}`,{taskId:t.id,kind:'مهمة'});
    }
  });
  state.medicineInventory.forEach(i=>{
    const qty=safeNumber(i.quantity), min=safeNumber(i.minStock);
    if(qty<=min) add(qty<=0?'red':'orange',`مخزون الدواء منخفض: ${i.name} — المتبقي ${qty} ${i.unit||''}`,{kind:'مخزون دواء'});
    if(i.expiryDate){
      const rem=daysBetween(today,i.expiryDate);
      if(rem<0) add('red',`انتهت صلاحية الدواء: ${i.name}`,{kind:'انتهاء دواء'});
      else if(rem<=30) add('yellow',`دواء ${i.name} تنتهي صلاحيته خلال ${rem} يوم`,{kind:'انتهاء دواء'});
    }
  });
  state.feedInventory.forEach(i=>{
    if(safeNumber(i.quantity)<=safeNumber(i.minStock)) add(safeNumber(i.quantity)<=0?'red':'orange',`مخزون العلف منخفض: ${i.name} — المتبقي ${i.quantity} ${i.unit||''}`,{kind:'مخزون علف'});
  });
  const rank={red:0,orange:1,yellow:2,green:3};
  return notes.sort((a,b)=>rank[a.level]-rank[b.level]);
};

/* ============================= روابط الصور الآمنة (Signed URLs) ============================= */
/* بدلاً من الاعتماد على رابط عام دائم للصورة، نولّد رابطًا موقّعًا صالحًا لفترة محدودة عند العرض فقط.
   هذا يعمل بشكل صحيح سواء بقي الـ Bucket عامًا أو تم تحويله إلى خاص من لوحة Supabase. */
const _signedUrlCache = new Map();
function _applySignedUrl(els, url, path){
  els.forEach(el=>{
    if(el.tagName==='IMG') el.src=url; else if(el.tagName==='A') el.href=url;
    el.setAttribute('data-photo-hydrated', path);
  });
}
async function hydrateSignedImages(){
  const nodes=Array.from(document.querySelectorAll('[data-photo-path]')).filter(el=>{
    const p=el.getAttribute('data-photo-path');
    return p && el.getAttribute('data-photo-hydrated')!==p;
  });
  if(!nodes.length) return;
  const byPath=new Map();
  nodes.forEach(el=>{ const p=el.getAttribute('data-photo-path'); if(!byPath.has(p)) byPath.set(p,[]); byPath.get(p).push(el); });
  const now=Date.now(), toFetch=[];
  byPath.forEach((els,p)=>{
    const cached=_signedUrlCache.get(p);
    if(cached && cached.exp>now+30000) _applySignedUrl(els,cached.url,p);
    else toFetch.push(p);
  });
  if(!toFetch.length) return;
  try{
    const ttl=900;
    const {data,error}=await supabaseClient.storage.from(MEDIA_BUCKET).createSignedUrls(toFetch,ttl);
    if(error) throw error;
    (data||[]).forEach(item=>{
      if(item.signedUrl){
        _signedUrlCache.set(item.path,{url:item.signedUrl,exp:Date.now()+ttl*1000});
        _applySignedUrl(byPath.get(item.path)||[], item.signedUrl, item.path);
      }
    });
  }catch(e){ console.warn('تعذر تجديد روابط الصور الموقعة',e); }
}

async function uploadAnimalPhoto(animalId){
  const a=animalById(animalId), input=document.getElementById('animalPhotoUpload');

  try{
    showToast('جاري رفع الصورة…');

    saveState(); showToast('تم رفع الصورة'); renderView();

function storageErrorMessage(e){
  const m=String(e?.message||e||'');
  if(/bucket|not found|row-level|policy|permission|unauthorized/i.test(m)) return 'رفع الصور يحتاج تشغيل ملف supabase-setup.sql مرة واحدة';
  return 'تعذر رفع الصورة: '+m;
}
function setMainPhoto(animalId,photoId){
  const a=animalById(animalId); (a.photos||[]).forEach(p=>p.main=p.id===photoId);

async function removeAnimalPhoto(animalId,photoId){
  if(!confirm('حذف هذه الصورة؟'))return;
  const a=animalById(animalId), p=(a.photos||[]).find(x=>x.id===photoId);
  if(p?.path) await deleteMedia(p.path);
  a.photos=(a.photos||[]).filter(x=>x.id!==photoId);
  if(p?.main){
    if(a.photos.length){a.photos[0].main=true;a.photoUrl=a.photos[0].url;} else a.photoUrl='';
  }
  saveState();renderView();
}

saveBirth = async function(id){
  const a=animalById(id),count=Math.max(1,Math.min(8,parseInt(document.getElementById('brCount').value)||1));

createOffspring = function(motherId,birthId,newbornIndex=0){

  if(!n){showToast('بيانات المولود غير موجودة');return;}
  let fatherId=mother.pregnancy?.breedingId?mother.breedings.find(b=>b.id===mother.pregnancy.breedingId)?.maleId:null;
  if(!fatherId) fatherId=(mother.breedings.slice(-1)[0]||{}).maleId||null;
  window.__pendingNewbornLink={motherId,birthId,newbornIndex};
  openAddAnimal({_offspringOf:birthId,type:mother.type,gender:n.gender,birthDate:birth.date,weight:n.weight,motherId:mother.id,fatherId,location:mother.location,notes:n.notes||''});
};

  if(!m.name){showToast('أدخل اسم الدواء');return;}
  a.medications.push(m);addTimeline(a,`بدء دواء: ${m.name}`,'دواء');saveState();closeModal();profileTab='meds';renderView();

function completeMedicationDose(animalId,medId){
  const a=animalById(animalId),m=a.medications.find(x=>x.id===medId); if(!m)return;
  const now=new Date();m.logs=m.logs||[];m.logs.push({at:now.toISOString(),dose:m.dose,unit:m.doseUnit});
  const next=new Date(now.getTime()+m.frequencyHours*3600000);
  m.nextDoseAt=next.toISOString();
  if(m.endAt&&next>new Date(m.endAt))m.active=false;
  addTimeline(a,`تم إعطاء جرعة: ${m.name}`,'دواء');saveState();showToast('تم تسجيل الجرعة');renderView();
}
function stopMedication(animalId,medId){
  const a=animalById(animalId),m=a.medications.find(x=>x.id===medId);m.active=false;m.stoppedAt=new Date().toISOString();saveState();renderView();
}

let reportMonth=monthKey(todayISO());
function reportData(month){
  const animals=state.animals,active=animals.filter(a=>a.status==='موجود في المزرعة');
  const births=[];animals.forEach(a=>(a.births||[]).forEach(b=>{if(monthKey(b.date)===month)births.push({mother:a.customId,date:b.date,count:(b.newborns||[]).length||b.count||1,type:b.type});}));
  const health=[];animals.forEach(a=>(a.healthCases||[]).forEach(h=>{const d=h.at?h.at.slice(0,10):h.date;if(monthKey(d)===month)health.push({animal:a.customId,date:d,diagnosis:h.diagnosis,severity:h.severity,status:h.caseStatus});}));
  const meds=[];animals.forEach(a=>(a.medications||[]).forEach(m=>{const d=(m.startAt||m.startDate||'').slice(0,10);if(monthKey(d)===month)meds.push({animal:a.customId,date:d,name:m.name,dose:(m.dose||'')+' '+(m.doseUnit||'')});}));
  const vacc=[];animals.forEach(a=>(a.vaccinations||[]).forEach(v=>{if(monthKey(v.date)===month)vacc.push({animal:a.customId,date:v.date,name:v.name,dose:v.dose});}));
  const trans=state.transactions.filter(t=>monthKey(t.date)===month),expenses=state.expenses.filter(e=>monthKey(e.date)===month);
  return {active,births,health,meds,vacc,trans,expenses,
    totalExpenses:expenses.reduce((s,e)=>s+safeNumber(e.amount),0),
    sales:trans.filter(t=>t.type==='بيع').reduce((s,t)=>s+safeNumber(t.amount),0),
    purchases:trans.filter(t=>t.type==='شراء').reduce((s,t)=>s+safeNumber(t.amount),0)};
}

function downloadBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function exportCSV(){
  const r=reportData(reportMonth),rows=[['تقرير الجليديه',reportMonth],[],['النوع','التفاصيل','التاريخ','المبلغ/العدد']];
  r.births.forEach(x=>rows.push(['ولادة',`الأم ${x.mother} - ${x.type}`,x.date,x.count]));
  r.health.forEach(x=>rows.push(['صحة',`${x.animal} - ${x.diagnosis||''} - ${x.severity||''}`,x.date,'']));
  r.trans.forEach(x=>rows.push([x.type,animalById(x.animalId)?.customId||'',x.date,x.amount]));
  r.expenses.forEach(x=>rows.push(['مصروف',x.category,x.date,x.amount]));
  const csv='\uFEFF'+rows.map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`aljalidiyah-${reportMonth}.csv`);
}
function exportExcel(){
  if(!window.XLSX){showToast('تعذر تحميل أداة Excel');return;}
  const r=reportData(reportMonth),wb=XLSX.utils.book_new();
  const animals=state.animals.map(a=>({الرقم:a.customId,النوع:animalTypeName(a.type),الجنس:a.gender,الاسم:a.name,السلالة:a.breed,الميلاد:a.birthDate,العمر:calcAge(a.birthDate),الوزن:a.weight,الحالة:a.status,الصحة:a.healthStatus}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(animals),'الحيوانات');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.births),'الولادات');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.health),'الصحة');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.trans.map(t=>({...t,animal:animalById(t.animalId)?.customId||''}))),'البيع والشراء');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.expenses),'المصاريف');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(state.medicineInventory),'مخزون الأدوية');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(state.feedInventory),'مخزون الأعلاف');
  XLSX.writeFile(wb,`aljalidiyah-${reportMonth}.xlsx`);
}
function printReport(){
  const html=document.getElementById('printReport')?.innerHTML||'',w=window.open('','_blank');

    (a.births||[]).forEach(b=>{ (b.newborns||[]).forEach((n,i)=>{ if(n.photoPath) items.push({path:n.photoPath,kind:'birth_newborn',animalId:a.id,birthId:b.id,newbornIndex:i}); }); });
    (a.healthCases||[]).forEach(h=>{ (h.photos||[]).forEach(p=>{ if(p.path) items.push({path:p.path,kind:'health_case',animalId:a.id,healthCaseId:h.id}); }); });
  });
  (state.expenses||[]).forEach(e=>{ if(e.receiptPath) items.push({path:e.receiptPath,kind:'expense_receipt',expenseId:e.id}); });
  (state.medicineInventory||[]).forEach(i=>{ if(i.photoPath) items.push({path:i.photoPath,kind:'medicine_inventory',itemId:i.id}); });
  return items;
}
async function exportFullBackupZip(){
  if(!window.JSZip){showToast('تعذر تحميل أداة الضغط (JSZip)، تحقق من الاتصال بالإنترنت');return;}
  const btn=document.getElementById('fullBackupBtn'); if(btn){btn.disabled=true;btn.textContent='جاري التجهيز...';}
  showToast('جاري تجهيز النسخة الاحتياطية الكاملة، قد يستغرق هذا بعض الوقت...');
  try{
    const zip=new JSZip();
    zip.file('data.json', JSON.stringify({app:'الجليديه',version:3,exportedAt:new Date().toISOString(),state},null,2));
    const manifest=collectPhotoManifest();
    const photosFolder=zip.folder('photos');
    let ok=0, fail=0;
    for(const item of manifest){
      try{
        const {data,error}=await supabaseClient.storage.from(MEDIA_BUCKET).download(item.path);
        if(error) throw error;
        photosFolder.file(item.path, data);
        ok++;
      }catch(e){ fail++; item.downloadFailed=true; }
    }
    zip.file('manifest.json', JSON.stringify(manifest,null,2));
    const blob=await zip.generateAsync({type:'blob'});
    downloadBlob(blob, `aljalidiyah-full-backup-${todayISO()}.zip`);
    showToast(`تم إنشاء النسخة الاحتياطية: ${ok} صورة${fail?` — تعذر تنزيل ${fail}`:''}`);
  }catch(e){ showToast('تعذر إنشاء النسخة الاحتياطية: '+e.message); }
  finally{ if(btn){btn.disabled=false;btn.textContent='تنزيل نسخة احتياطية كاملة (ZIP)';} }
}
async function importFullBackupZip(){
  const file=document.getElementById('fullBackupFile')?.files?.[0];
  if(!file){showToast('اختر ملف ZIP الخاص بالنسخة الاحتياطية');return;}
  if(!window.JSZip){showToast('تعذر تحميل أداة فك الضغط (JSZip)');return;}
  if(!confirm('سيتم استبدال كل البيانات الحالية وإعادة رفع الصور من الملف. متابعة؟'))return;
  showToast('جاري استعادة النسخة الاحتياطية الكاملة...');
  try{
    const zip=await JSZip.loadAsync(file);
    const dataFile=zip.file('data.json'); if(!dataFile) throw new Error('data.json غير موجود داخل الملف');
    const obj=JSON.parse(await dataFile.async('string'));
    const manifestFile=zip.file('manifest.json');
    const manifest=manifestFile?JSON.parse(await manifestFile.async('string')):[];
    let ok=0, fail=0;
    for(const item of manifest){
      const f=zip.file('photos/'+item.path);
      if(!f) continue;
      try{
        const blob=await f.async('blob');
        const {error}=await supabaseClient.storage.from(MEDIA_BUCKET).upload(item.path, blob, {upsert:true});
        if(error) throw error;
        ok++;
      }catch(e){ fail++; }
    }
    state=normalizeState(obj.state||obj);
    saveState();
    showToast(`تمت الاستعادة: ${ok} صورة${fail?` — تعذر رفع ${fail}`:''}`);
    navigate('dashboard');
  }catch(e){ showToast('ملف النسخة الاحتياطية غير صالح: '+e.message); }
}

/* ============================= مسح QR من الكاميرا ============================= */
let _qrStream=null, _qrRAF=null;
function openQRScanner(){
  if(!session.loggedIn){showToast('سجّل الدخول أولًا');return;}
  openModal('مسح رمز QR', `
    <div class="notice">وجّه الكاميرا نحو رمز QR الخاص بالحيوان ليفتح ملفه مباشرة.</div>
    <video id="qrVideo" playsinline muted style="width:100%;border-radius:14px;background:#000;margin-top:8px"></video>
    <div id="qrScanStatus" class="muted" style="text-align:center;margin-top:8px">جاري تشغيل الكاميرا...</div>
  `, startQRScanner);
}
async function startQRScanner(){
  const video=document.getElementById('qrVideo'), statusEl=document.getElementById('qrScanStatus');
  if(!window.jsQR){ if(statusEl) statusEl.textContent='تعذر تحميل أداة قراءة QR'; return; }
  try{
    _qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  }catch(e){
    if(statusEl) statusEl.textContent='تعذر الوصول إلى الكاميرا — تأكد من السماح بذلك من إعدادات المتصفح.';
    return;
  }
  if(!document.getElementById('qrVideo')) { stopQRScanner(); return; } // أُغلقت النافذة أثناء الانتظار
  video.srcObject=_qrStream;
  await video.play();
  const canvas=document.createElement('canvas'), ctx=canvas.getContext('2d');
  const tick=()=>{
    if(!document.getElementById('qrVideo')){ stopQRScanner(); return; }
    if(video.readyState===video.HAVE_ENOUGH_DATA){
      canvas.width=video.videoWidth; canvas.height=video.videoHeight;
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
      const code=jsQR(imgData.data,imgData.width,imgData.height);
      if(code && code.data){ handleScannedQR(code.data); return; }
    }
    _qrRAF=requestAnimationFrame(tick);
  };
  _qrRAF=requestAnimationFrame(tick);
}
function stopQRScanner(){
  if(_qrRAF) cancelAnimationFrame(_qrRAF); _qrRAF=null;
  if(_qrStream){ _qrStream.getTracks().forEach(t=>t.stop()); _qrStream=null; }
}
function handleScannedQR(text){
  stopQRScanner();
  let id=null;
  try{ id=new URL(text).searchParams.get('animal'); }catch(e){ id=null; }
  let a=id?animalById(id):null;
  if(!a) a=state.animals.find(x=>x.customId===text || x.id===text);
  closeModal();
  if(a){ profileTab='info'; navigate('animalProfile',{id:a.id}); showToast('تم فتح ملف '+a.customId); }
  else showToast('لم يتم التعرف على حيوان مطابق لهذا الرمز');
}

/* المهام: الضغط يفتح الهدف، والإنجاز يحتاج تأكيد */
const TASK_CATEGORIES=['عام','متابعة','صحة','دواء','تطعيم','تلقيح','حمل','ولادة','وزن','مصاريف','أعلاف','مخزون أدوية'];
function taskCategoryIcon(c){return({عام:'✅',متابعة:'⏱️',صحة:'🩺',دواء:'💊',تطعيم:'💉',تلقيح:'🐂',حمل:'🤰',ولادة:'🍼',وزن:'⚖️',مصاريف:'💳',أعلاف:'🌾','مخزون أدوية':'💊'})[c]||'✅';}
function taskDueAt(t){ if(t.dueAt)return new Date(t.dueAt); return new Date((t.dueDate||todayISO())+'T'+(t.dueTime||'23:59')); }
function taskTargetTab(category){return({متابعة:'followups',صحة:'health',دواء:'meds',تطعيم:'vacc',تلقيح:'breeding',حمل:'pregnancy',ولادة:'births',وزن:'weight'})[category]||'info';}
function openTaskTarget(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  if(t.animalId&&animalById(t.animalId)){profileTab=taskTargetTab(t.category);navigate('animalProfile',{id:t.animalId});return;}
  const v=({مصاريف:'expenses',أعلاف:'feedInventory','مخزون أدوية':'medicineInventory',ولادة:'births'})[t.category]||'tasks';
  navigate(v);
}
function openCompleteTask(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  openModal('تأكيد إنجاز المهمة',`
    <div class="notice"><b>${esc(t.title)}</b><br>${t.animalId&&animalById(t.animalId)?esc(animalLabel(animalById(t.animalId))):esc(t.category||'عام')}</div>
    <div class="field"><label>ملاحظة (اختياري)</label><textarea id="taskDoneNote" placeholder="مثال: تم التنفيذ بدون ملاحظات"></textarea></div>
    <button class="btn block" onclick="completeTaskConfirmed('${id}')">نعم، تمت المهمة</button>
    <button class="btn block ghost" style="margin-top:7px" onclick="closeModal()">رجوع</button>`);
}
function completeTaskConfirmed(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  t.done=true;t.completedAt=new Date().toISOString();t.completedNote=document.getElementById('taskDoneNote')?.value.trim()||'';
  const repeat=t.repeat||t.type||'مرة واحدة';
  if(repeat!=='مرة واحدة'){
    const d=taskDueAt(t);d.setDate(d.getDate()+(repeat==='يوميًا'?1:7));
    state.tasks.push({...t,id:uid('t'),done:false,completedAt:null,completedNote:'',dueDate:localISODate(d),dueTime:`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,dueAt:d.toISOString()});
  }
  saveState();closeModal();showToast('تم تأكيد إنجاز المهمة');renderView();
}
toggleTaskDone = function(id){ openCompleteTask(id); };
deleteTask = function(id){ if(!confirm('حذف هذه المهمة؟'))return;state.tasks=state.tasks.filter(x=>x.id!==id);saveState();renderView(); };

function taskItem(t,compact=false){
  const a=t.animalId?animalById(t.animalId):null, due=taskDueAt(t), late=!t.done&&due<Date.now(), cat=t.category||'عام';
  return `<div class="simple-card ${t.done?'':'clickable'}" style="${late?'border-color:rgba(193,68,59,.28)':''}">
    <div class="simple-head">
      <div style="flex:1" onclick="${t.done?'':'openTaskTarget(\''+t.id+'\')'}">
        <div class="simple-title">${taskCategoryIcon(cat)} ${esc(t.title)}</div>
        <div class="simple-sub">${a?esc(animalLabel(a)):(cat!=='عام'?esc(cat):'مهمة عامة')} · ${fmtDateTime(due.toISOString())}${late?' · متأخرة':''}</div>
      </div>
      ${t.done?`<span class="chip soft">تمت</span>`:`<div class="task-actions"><button class="task-open-btn" onclick="openTaskTarget('${t.id}')">فتح</button><button class="task-done-btn" onclick="openCompleteTask('${t.id}')">تم</button></div>`}
    </div>
    ${t.done&&t.completedNote?`<div class="simple-sub">${esc(t.completedNote)}</div>`:''}
    ${!compact?`<div style="text-align:left;margin-top:5px"><button class="btn small ghost" onclick="deleteTask('${t.id}')">حذف</button></div>`:''}
  </div>`;
}
renderTasks = function(){
  const pending=state.tasks.filter(t=>!t.done).sort((a,b)=>taskDueAt(a)-taskDueAt(b)), done=state.tasks.filter(t=>t.done).sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));
  const now=new Date(),today=todayISO();
  const overdue=pending.filter(t=>taskDueAt(t)<now&&t.dueDate!==today), todayList=pending.filter(t=>t.dueDate===today), upcoming=pending.filter(t=>t.dueDate>today);
  return `<div class="section-title">المهام</div><button class="btn block" onclick="openAddTask()">+ إضافة مهمة</button>
    ${overdue.length?`<div class="section-title" style="font-size:14px">متأخرة (${overdue.length})</div>${overdue.map(t=>taskItem(t)).join('')}`:''}
    <div class="section-title" style="font-size:14px">اليوم (${todayList.length})</div>${todayList.length?todayList.map(t=>taskItem(t)).join(''):`<div class="empty">لا توجد مهام اليوم</div>`}
    ${upcoming.length?`<div class="section-title" style="font-size:14px">قادمة</div>${upcoming.slice(0,12).map(t=>taskItem(t)).join('')}`:''}
    ${done.length?`<details class="simple-details"><summary>المهام المكتملة (${done.length}) ▾</summary><div style="height:8px"></div>${done.slice(0,15).map(t=>taskItem(t)).join('')}</details>`:''}`;
};
openAddTask = function(){
  openModal('إضافة مهمة',`
    <div class="field"><label>المهمة</label><input id="tTitle" placeholder="مثال: فحص حرارة C-018"></div>
    <div class="field-row"><div class="field"><label>النوع</label><select id="tCategory">${TASK_CATEGORIES.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>الحيوان (اختياري)</label><select id="tAnimal"><option value="">— بدون —</option>${state.animals.filter(a=>a.status==='موجود في المزرعة').map(a=>`<option value="${a.id}">${esc(animalLabel(a))}</option>`).join('')}</select></div></div>
    <div class="field-row"><div class="field"><label>التاريخ</label><input type="date" id="tDue" value="${todayISO()}"></div><div class="field"><label>الوقت</label><input type="time" id="tTime" value="${nowTimeStr()}"></div></div>
    <div class="field"><label>التكرار</label><select id="tRepeat"><option>مرة واحدة</option><option>يوميًا</option><option>أسبوعيًا</option></select></div>
    <button class="btn block" onclick="saveTask()">حفظ المهمة</button>`);
};
saveTask = function(){
  const title=document.getElementById('tTitle').value.trim();if(!title){showToast('اكتب المهمة');return;}
  const date=document.getElementById('tDue').value,time=document.getElementById('tTime').value||'09:00';
  const t={id:uid('t'),title,category:document.getElementById('tCategory').value,animalId:document.getElementById('tAnimal').value||null,dueDate:date,dueTime:time,dueAt:new Date(`${date}T${time}`).toISOString(),repeat:document.getElementById('tRepeat').value,type:document.getElementById('tRepeat').value,done:false};
  state.tasks.push(t);saveState();closeModal();showToast('تمت إضافة المهمة');renderView();
};

/* التنبيهات: الضغط يفتح الشيء الصحيح */
alertRow = function(n){

  else if(['مخزون دواء','انتهاء دواء'].includes(n.kind)) action=`navigate('medicineInventory')`;
  return `<div class="alert ${n.level}" ${action?`onclick="${action}" style="cursor:pointer"`:''}><div class="dot ${n.level}"></div><div class="alert-text">${esc(n.text)}</div></div>`;

function saveAnimalType(typeId=''){
  const f=document.getElementById('atFemale').value.trim(),m=document.getElementById('atMale').value.trim(),p=document.getElementById('atPlural').value.trim();
  if(!f||!m||!p){showToast('أدخل أسماء الأنثى والذكر والمجموعة');return;}
  const id=typeId||('type_'+Date.now().toString(36));

let _finalDataBlocked=false;
let _finalDataLoadError='';
let _autoBackupRunning=false;

function privatePathFromOldUrl(url){
  if(!url)return '';
  try{
    const u=new URL(url,location.href),m=u.pathname.match(/\/storage\/v1\/object\/(?:public|sign|authenticated)\/farm-media\/(.+)$/);
    return m?decodeURIComponent(m[1]):'';
  }catch(e){return '';}
}
function scrubPrivateMediaUrls(st){
  if(!st)return false;let changed=false;
  const scrub=(obj,urlKey,pathKey)=>{
    if(!obj)return;
    if(!obj[pathKey]&&obj[urlKey]){const recovered=privatePathFromOldUrl(obj[urlKey]);if(recovered){obj[pathKey]=recovered;changed=true;}}
    if(obj[pathKey]&&obj[urlKey]){obj[urlKey]='';changed=true;}
  };
  (st.animals||[]).forEach(a=>{
    (a.photos||[]).forEach(p=>scrub(p,'url','path'));
    const main=(a.photos||[]).find(p=>p.main)||(a.photos||[])[0];
    if(main?.path&&a.photoUrl){a.photoUrl='';changed=true;}
    (a.births||[]).forEach(b=>(b.newborns||[]).forEach(n=>scrub(n,'photoUrl','photoPath')));
    (a.healthCases||[]).forEach(h=>(h.photos||[]).forEach(p=>scrub(p,'url','path')));
  });
  (st.expenses||[]).forEach(e=>scrub(e,'receiptUrl','receiptPath'));
  (st.medicineInventory||[]).forEach(i=>scrub(i,'photoUrl','photoPath'));
  return changed;
}

/* روابط العرض مؤقتة 15 دقيقة فقط. */
hydrateSignedImages = async function(){
  const nodes=Array.from(document.querySelectorAll('[data-photo-path]')).filter(el=>{
    const p=el.getAttribute('data-photo-path');
    return p && el.getAttribute('data-photo-hydrated')!==p;
  });
  if(!nodes.length) return;
  const byPath=new Map();
  nodes.forEach(el=>{const p=el.getAttribute('data-photo-path');if(!byPath.has(p))byPath.set(p,[]);byPath.get(p).push(el);});
  const now=Date.now(),toFetch=[];
  byPath.forEach((els,p)=>{
    const cached=_signedUrlCache.get(p);
    if(cached&&cached.exp>now+30000)_applySignedUrl(els,cached.url,p);else toFetch.push(p);
  });
  if(!toFetch.length)return;
  try{
    const ttl=900;
    const {data,error}=await supabaseClient.storage.from(MEDIA_BUCKET).createSignedUrls(toFetch,ttl);
    if(error)throw error;
    (data||[]).forEach(item=>{if(item.signedUrl){_signedUrlCache.set(item.path,{url:item.signedUrl,exp:Date.now()+ttl*1000});_applySignedUrl(byPath.get(item.path)||[],item.signedUrl,item.path);}});
  }catch(e){console.warn('تعذر تجديد روابط الصور الموقعة',e);}
};

/* ============================= المتابعات: ساعة إلى شهر ============================= */
function addMonthsClamped(date,months){
  const d=new Date(date),day=d.getDate();
  d.setDate(1);d.setMonth(d.getMonth()+months);
  const max=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  d.setDate(Math.min(day,max));
  return d;
}
function nextFollowupFrom(f,from){
  const d=new Date(from||new Date());
  let type=f.frequencyType||'hours',value=Math.max(1,Number(f.frequencyValue)||Number(f.frequencyHours)||24);
  if(!f.frequencyType){const h=Number(f.frequencyHours||0);if(h===168){type='weeks';value=1;}else if(h===336){type='weeks';value=2;}else if(h===720){type='months';value=1;}else if(h===24){type='days';value=1;}}
  if(type==='months') return addMonthsClamped(d,value);
  if(type==='weeks'){d.setDate(d.getDate()+value*7);return d;}
  if(type==='days'){d.setDate(d.getDate()+value);return d;}
  d.setHours(d.getHours()+value);return d;
}
function followupFreqLabel(f){
  if(!f.frequencyType){const h=Number(f.frequencyHours||0);if(h===168)return 'كل أسبوع';if(h===336)return 'كل أسبوعين';if(h===720)return 'كل شهر';}
  if(f.frequencyType==='months')return f.frequencyValue===1?'كل شهر':`كل ${f.frequencyValue} أشهر`;
  if(f.frequencyType==='weeks')return f.frequencyValue===1?'كل أسبوع':f.frequencyValue===2?'كل أسبوعين':`كل ${f.frequencyValue} أسابيع`;
  if(f.frequencyType==='days')return f.frequencyValue===1?'مرة يوميًا':`كل ${f.frequencyValue} أيام`;
  const h=Number(f.frequencyValue||f.frequencyHours||24);
  if(h===1)return 'كل ساعة';if(h===3)return 'كل 3 ساعات';if(h===12)return 'مرتين يوميًا';if(h===24)return 'مرة يوميًا';
  return `كل ${h} ساعة`;
}

/* ============================= طباعة داخل نفس الصفحة — متوافق مع Safari ============================= */
function printInSamePage(title,html,extraCss=''){
  document.getElementById('finalPrintArea')?.remove();document.getElementById('finalPrintStyle')?.remove();
  const area=document.createElement('div');area.id='finalPrintArea';area.innerHTML=html;document.body.appendChild(area);
  const style=document.createElement('style');style.id='finalPrintStyle';style.textContent=`
    #finalPrintArea{display:none}
    @media print{
      @page{size:A4;margin:12mm}
      body>*:not(#finalPrintArea){display:none!important}
      #finalPrintArea{display:block!important;direction:rtl;color:#2e2118;background:#fff;font-family:Arial,sans-serif}
      #finalPrintArea *{box-sizing:border-box}
      ${extraCss}
    }`;
  document.head.appendChild(style);
  const oldTitle=document.title;document.title=title;
  let cleaned=false;const cleanup=()=>{if(cleaned)return;cleaned=true;area.remove();style.remove();document.title=oldTitle;};
  window.addEventListener('afterprint',cleanup,{once:true});
  setTimeout(()=>window.print(),80);setTimeout(cleanup,60000);
}

    <div class="field"><label>صنف الحلال</label><select id="qrTypeFilter" onchange="filterQRPicks()"><option value="all">كل الأنواع</option>${allAnimalTypes().map(t=>`<option value="${esc(t.id)}">${esc(t.plural)}</option>`).join('')}</select></div>
    <div class="grid2" style="margin:8px 0"><button class="btn small ghost" onclick="selectVisibleQR(true)">تحديد الظاهر</button><button class="btn small ghost" onclick="selectVisibleQR(false)">إلغاء الظاهر</button></div>
    <div class="muted" style="margin-bottom:7px">المحدد: <b id="qrPickCount">${animals.length}</b></div>
    <div style="max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px">${rows||'<div class="empty">لا توجد حيوانات</div>'}</div>
    <div class="field" style="margin-top:10px"><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="qrOnePage"> عدة رموز في صفحة واحدة</label></div>
    <button class="btn block" id="qrPrintBtn" onclick="printBulkQR()">طباعة المحدد</button>`);
};
printBulkQR=async function(){
  const ids=Array.from(document.querySelectorAll('.qrPickCb:checked')).map(c=>c.value);if(!ids.length){showToast('اختر حيوانًا واحدًا على الأقل');return;}
  const btn=document.getElementById('qrPrintBtn');if(btn){btn.disabled=true;btn.textContent='جاري التجهيز...';}
  const onePage=document.getElementById('qrOnePage')?.checked,base=location.origin+location.pathname,tmp=document.createElement('div');tmp.style.cssText='position:fixed;left:-9999px;top:-9999px';document.body.appendChild(tmp);
  const items=[];
  for(const id of ids){
    const a=animalById(id);if(!a)continue;
    const url=`${base}?animal=${encodeURIComponent(a.id)}&type=${encodeURIComponent(a.type)}&code=${encodeURIComponent(a.customId)}`;
    const box=document.createElement('div');tmp.appendChild(box);new QRCode(box,{text:url,width:260,height:260});await new Promise(r=>setTimeout(r,25));
    const img=box.querySelector('canvas,img'),dataUrl=img?(img.tagName==='CANVAS'?img.toDataURL('image/png'):img.src):'';
    items.push({kind:genderedTypeName(a.type,a.gender),group:animalTypeName(a.type),code:a.customId,name:a.name||'',dataUrl});
  }
  tmp.remove();closeModal();
  const pages=items.map(it=>`<div class="qrpage"><div class="qrbrand">الجليديه</div><div class="qrkind">${esc(it.kind)} · ${esc(it.code)}</div>${it.name?`<div class="qrname">${esc(it.name)}</div>`:''}<img src="${it.dataUrl}"><div class="qrgroup">الصنف: ${esc(it.group)}</div></div>`).join('');
  printInSamePage('رموز QR — الجليديه',`<div class="qrwrap ${onePage?'multi':'single'}">${pages}</div>`,`.qrwrap.single .qrpage{height:250mm;page-break-after:always;text-align:center;padding-top:35mm}.qrwrap.single .qrpage:last-child{page-break-after:auto}.qrwrap.multi{display:grid;grid-template-columns:repeat(3,1fr);gap:10mm}.qrwrap.multi .qrpage{text-align:center;border:1px solid #ddd;border-radius:10px;padding:8mm;break-inside:avoid}.qrpage img{width:55mm;height:55mm;max-width:100%}.qrbrand{font-size:24px;font-weight:bold;margin-bottom:8px}.qrkind{font-size:18px;font-weight:bold}.qrname{font-size:14px;margin:4px}.qrgroup{font-size:12px;margin-top:8px}`);
};

/* ============================= Backup كامل + أسبوعي تلقائي داخل التخزين الخاص ============================= */
async function buildFullBackupBlob(){
  if(!window.JSZip)throw new Error('تعذر تحميل JSZip');
  const zip=new JSZip();
  const snapshot=JSON.parse(JSON.stringify(state));
  zip.file('data.json',JSON.stringify({app:'الجليديه',version:5,exportedAt:new Date().toISOString(),state:snapshot},null,2));
  const manifestRaw=collectPhotoManifest(),manifest=[...new Map(manifestRaw.map(x=>[x.path,x])).values()];
  const photosFolder=zip.folder('photos');let ok=0,fail=0;
  for(const item of manifest){try{const {data,error}=await supabaseClient.storage.from(MEDIA_BUCKET).download(item.path);if(error)throw error;photosFolder.file(item.path,data);ok++;}catch(e){fail++;item.downloadFailed=true;}}
  zip.file('manifest.json',JSON.stringify(manifest,null,2));
  return {blob:await zip.generateAsync({type:'blob'}),ok,fail,total:manifest.length};
}
exportFullBackupZip=async function(){
  const btn=document.getElementById('fullBackupBtn');if(btn){btn.disabled=true;btn.textContent='جاري التجهيز...';}showToast('جاري تجهيز النسخة الكاملة...');
  try{const r=await buildFullBackupBlob();downloadBlob(r.blob,`aljalidiyah-full-backup-${todayISO()}.zip`);showToast(`تم إنشاء النسخة: ${r.ok} صورة${r.fail?` — تعذر ${r.fail}`:''}`);}catch(e){showToast('تعذر إنشاء النسخة: '+e.message);}finally{if(btn){btn.disabled=false;btn.textContent='تنزيل نسخة احتياطية كاملة (ZIP)';}}
};
async function restoreFullBackupBlob(blob){
  if(!window.JSZip)throw new Error('تعذر تحميل JSZip');
  const zip=await JSZip.loadAsync(blob),dataFile=zip.file('data.json');if(!dataFile)throw new Error('data.json غير موجود');
  const obj=JSON.parse(await dataFile.async('string')),manifestFile=zip.file('manifest.json'),manifest=manifestFile?JSON.parse(await manifestFile.async('string')):[];let ok=0,fail=0;
  for(const item of manifest){const f=zip.file('photos/'+item.path);if(!f)continue;try{const b=await f.async('blob');const {error}=await supabaseClient.storage.from(MEDIA_BUCKET).upload(item.path,b,{upsert:true});if(error)throw error;ok++;}catch(e){fail++;}}
  state=normalizeState(obj.state||obj);scrubPrivateMediaUrls(state);_finalDataBlocked=false;saveState();renderApp();return {ok,fail};
}
importFullBackupZip=async function(){
  const file=document.getElementById('fullBackupFile')?.files?.[0];if(!file){showToast('اختر ملف ZIP');return;}if(!confirm('سيتم استبدال البيانات الحالية وإعادة رفع الصور. متابعة؟'))return;
  try{showToast('جاري الاستعادة...');const r=await restoreFullBackupBlob(file);showToast(`تمت الاستعادة: ${r.ok} صورة${r.fail?` — تعذر ${r.fail}`:''}`);navigate('dashboard');}catch(e){showToast('تعذرت الاستعادة: '+e.message);}
};
async function cleanupOldCloudBackups(){
  const folder=`${session.user.id}/backups`,{data,error}=await supabaseClient.storage.from(MEDIA_BUCKET).list(folder,{limit:100,sortBy:{column:'created_at',order:'desc'}});if(error)return;
  const files=(data||[]).filter(x=>x.name?.endsWith('.zip')).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  if(files.length>4)await supabaseClient.storage.from(MEDIA_BUCKET).remove(files.slice(4).map(x=>`${folder}/${x.name}`));
}
async function createCloudFullBackup(force=false){
  if(_autoBackupRunning||!session.user||!state||_finalDataBlocked)return false;
  if(!force && state.settings.autoBackupEnabled===false)return false;
  const last=state.settings.lastAutoBackupAt?new Date(state.settings.lastAutoBackupAt).getTime():0;
  if(!force && last && Date.now()-last<7*86400000)return false;
  _autoBackupRunning=true;
  try{
    const r=await buildFullBackupBlob();
    const stamp=new Date().toISOString().replace(/[:.]/g,'-'),path=`${session.user.id}/backups/aljalidiyah-${force?'manual':'auto'}-${stamp}.zip`;
    const {error}=await supabaseClient.storage.from(MEDIA_BUCKET).upload(path,r.blob,{contentType:'application/zip',upsert:false});if(error)throw error;
    state.settings.lastAutoBackupAt=new Date().toISOString();state.settings.lastAutoBackupPath=path;state.settings.lastAutoBackupPartial=r.fail>0;saveState();await cleanupOldCloudBackups();
    showToast(force?'تم حفظ نسخة سحابية كاملة ✓':'تم النسخ الاحتياطي الأسبوعي ✓');return true;
  }catch(e){console.error(e);if(force)showToast('تعذر النسخ السحابي: '+e.message);return false;}finally{_autoBackupRunning=false;}
}
function maybeRunAutoBackup(){setTimeout(()=>createCloudFullBackup(false),600);}
async function openCloudBackups(){
  if(!session.user)return;const folder=`${session.user.id}/backups`;
  openModal('النسخ السحابية','<div class="empty">جاري التحميل...</div>');
  const {data,error}=await supabaseClient.storage.from(MEDIA_BUCKET).list(folder,{limit:20,sortBy:{column:'created_at',order:'desc'}});
  if(error){document.getElementById('modalBody').innerHTML='<div class="notice danger">تعذر تحميل النسخ السحابية</div>';return;}
  const rows=(data||[]).filter(x=>x.name?.endsWith('.zip')).map(x=>`<div class="list-item"><div class="top"><span>${esc(x.name)}</span><span class="date">${x.created_at?fmtDateTime(x.created_at):''}</span></div><div class="action-line"><button class="btn small" onclick="restoreCloudBackup('${encodeURIComponent(x.name)}')">استعادة</button><button class="btn small ghost" onclick="downloadCloudBackup('${encodeURIComponent(x.name)}')">تنزيل</button></div></div>`).join('');
  document.getElementById('modalBody').innerHTML=rows||'<div class="empty">لا توجد نسخ سحابية بعد</div>';
}
async function downloadCloudBackup(encoded){
  const name=decodeURIComponent(encoded),path=`${session.user.id}/backups/${name}`,{data,error}=await supabaseClient.storage.from(MEDIA_BUCKET).download(path);if(error){showToast('تعذر تنزيل النسخة');return;}downloadBlob(data,name);
}
async function restoreCloudBackup(encoded){
  if(!confirm('سيتم استبدال البيانات الحالية بهذه النسخة. متابعة؟'))return;
  const name=decodeURIComponent(encoded),path=`${session.user.id}/backups/${name}`,{data,error}=await supabaseClient.storage.from(MEDIA_BUCKET).download(path);if(error){showToast('تعذر تنزيل النسخة');return;}
  try{showToast('جاري الاستعادة...');const r=await restoreFullBackupBlob(data);closeModal();showToast(`تمت الاستعادة: ${r.ok} صورة${r.fail?` — تعذر ${r.fail}`:''}`);navigate('dashboard');}catch(e){showToast('تعذرت الاستعادة: '+e.message);}
}

/* الإعدادات النهائية تشمل النسخ التلقائي وحالته. */
renderSettings=function(){
  const s=state.settings,autoOn=s.autoBackupEnabled!==false,last=s.lastAutoBackupAt?fmtDateTime(s.lastAutoBackupAt):'لم تُنشأ بعد';
  return `<div class="section-title">الإعدادات</div><div class="field"><label>اسم المزرعة</label><input id="setFarm" value="${esc(s.farmName||'الجليديه')}"></div><button class="btn block" onclick="state.settings.farmName=document.getElementById('setFarm').value.trim()||'الجليديه';saveState();showToast('تم الحفظ')">حفظ اسم المزرعة</button>
    <div class="section-title">أنواع الحلال</div><div class="notice">أضف أو عدّل الأنواع من هنا، وتظهر تلقائيًا في الحيوانات والتقارير والطباعة.</div>
    ${allAnimalTypes().map(t=>`<div class="type-settings-row"><div><b>${esc(t.plural)}</b><div class="meta">أنثى: ${esc(t.female)} · ذكر: ${esc(t.male)} · ${esc(t.prefix)} · حمل ${t.gestation} يوم</div></div><div class="action-line"><button class="btn small ghost" onclick="openAnimalTypeEditor('${t.id}')">تعديل</button><button class="btn small ghost" onclick="deleteAnimalType('${t.id}')">حذف</button></div></div>`).join('')}<button class="btn block ghost" onclick="openAnimalTypeEditor()">+ إضافة نوع جديد</button>
    <div class="section-title">النسخ الاحتياطي</div><div class="notice ok">النسخ السحابية والصور محفوظة داخل التخزين الخاص 🔒</div>
    <label class="list-item" style="display:flex;align-items:center;justify-content:space-between"><span><b>نسخة تلقائية كل أسبوع</b><div class="muted">تُنشأ عند فتح النظام إذا مر أسبوع</div></span><input type="checkbox" ${autoOn?'checked':''} onchange="state.settings.autoBackupEnabled=this.checked;saveState();showToast(this.checked?'تم تشغيل النسخ التلقائي':'تم إيقاف النسخ التلقائي')"></label>
    <div class="list-item"><div class="kv"><span class="k">آخر نسخة تلقائية/سحابية</span><span class="v">${esc(last)}</span></div></div>
    <div class="grid2"><button class="btn" onclick="createCloudFullBackup(true)">نسخة سحابية الآن</button><button class="btn ghost" onclick="openCloudBackups()">عرض النسخ السحابية</button></div>
    <button class="btn block" style="margin-top:8px" id="fullBackupBtn" onclick="exportFullBackupZip()">تنزيل نسخة احتياطية كاملة (ZIP)</button><div class="upload-box" style="margin-top:8px"><input type="file" accept=".zip" id="fullBackupFile"><button class="btn small" onclick="importFullBackupZip()">استعادة من ZIP</button></div>
    <div class="section-title">طباعة رموز QR</div><div class="notice">اختر النوع والحيوانات، ثم اطبع من Safari بدون نافذة منبثقة.</div><button class="btn block ghost" onclick="openBulkQRPrint()">اختيار وطباعة QR</button>
    <details class="simple-details" style="margin-top:12px"><summary>معلومات الحساب ▾</summary><div style="height:8px"></div><div class="notice">تسجيل الدخول عبر Supabase، ولا توجد كلمة مرور محفوظة داخل الموقع.</div><div class="muted">${esc(session.user?.email||'')}</div></details>`;
};

/* تسجيل الدخول والبدء: لا ندخل إلى التطبيق إلا بعد تحميل البيانات بنجاح. */
doLogin=async function(){
  const email=document.getElementById('loginUser').value.trim(),password=document.getElementById('loginPass').value;if(!email||!password){showToast('أدخل البريد الإلكتروني وكلمة المرور');return;}
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){showToast('تعذر تسجيل الدخول');return;}
  session.loggedIn=true;session.user=data.user;const ok=await loadState();renderApp();if(!ok)return;
  const q=desiredAnimalFromURL(),a=q?animalById(q):null;if(a){profileTab='info';navigate('animalProfile',{id:a.id});}else navigate('dashboard');maybeRunAutoBackup();
};
init=async function(){
  try{
    const {data:{session:authSession},error}=await supabaseClient.auth.getSession();if(error)throw error;
    if(authSession){session.loggedIn=true;session.user=authSession.user;const ok=await loadState();if(ok){const q=desiredAnimalFromURL(),a=q?animalById(q):null;if(a){session.view='animalProfile';session.params={id:a.id};profileTab='info';}}}
    else{state=defaultState();_finalDataBlocked=false;}
  }catch(e){console.error(e);if(session.loggedIn){state=null;_finalDataBlocked=true;_finalDataLoadError=e?.message||'تعذر الاتصال';}}
  renderApp();if(session.loggedIn&&!_finalDataBlocked)maybeRunAutoBackup();
};


init();
</script>
